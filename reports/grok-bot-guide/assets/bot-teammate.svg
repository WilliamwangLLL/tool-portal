  <rect class="p" width="720" height="280"/>
  <rect class="cinb" x="40" y="40" width="200" height="200" rx="18" stroke-width="2"/>
  <circle class="cin" cx="140" cy="108" r="28"/>
  <text x="140" y="116" text-anchor="middle" fill="#fffaf1" font-size="18" font-weight="700">P</text>
  <text class="ink" x="140" y="158" text-anchor="middle" font-size="18" font-weight="700">Piper</text>
  <text class="muted" x="140" y="182" text-anchor="middle" font-size="13">产品表现</text>
