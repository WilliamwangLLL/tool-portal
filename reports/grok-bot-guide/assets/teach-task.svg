<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-labelledby="t">
  <title id="t">Teach a task 流程</title>
  
<style>
  .p { fill: #fffaf1; }
  .ink { fill: #1a1611; }
  .muted { fill: #6a5f52; }
  .stroke { stroke: #c4b59a; fill: none; }
  .box { fill: #fffaf1; stroke: #c4b59a; }
  .cin { fill: #b1321a; }
  .pine { fill: #245848; }
  .gold { fill: #9a7428; }
  .cinb { fill: #f3ddd6; stroke: #b1321a; }
  .pineb { fill: #d7ebe2; stroke: #245848; }
  .goldb { fill: #f3e6c4; stroke: #9a7428; }
  .soft { fill: #f3eee4; stroke: #d8cdbb; }
  text { font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif; }
  @media (prefers-color-scheme: dark) {
    .p { fill: #1c1914; }
    .ink { fill: #f3eadc; }
    .muted { fill: #b3a693; }
    .stroke { stroke: #5a5044; }
    .box { fill: #1c1914; stroke: #5a5044; }
    .cin { fill: #e06a4c; }
    .pine { fill: #7ec9ae; }
    .gold { fill: #e0c078; }
    .cinb { fill: #3a221c; stroke: #e06a4c; }
    .pineb { fill: #1b322b; stroke: #7ec9ae; }
    .goldb { fill: #332a16; stroke: #e0c078; }
    .soft { fill: #13110e; stroke: #3a342b; }
  }
</style>

  <rect class="p" width="720" height="160"/>
  <g font-size="12">
    <rect class="box" x="16" y="36" width="110" height="70" rx="10" stroke-width="1.5"/>
    <text class="ink" x="71" y="68" text-anchor="middle" font-size="13">1:1 聊天</text>
    <text class="muted" x="71" y="88" text-anchor="middle">+ 电脑画面</text>
    <rect class="box" x="150" y="36" width="110" height="70" rx="10" stroke-width="1.5"/>
    <text class="ink" x="205" y="68" text-anchor="middle" font-size="13">Teach a task</text>
    <text class="muted" x="205" y="88" text-anchor="middle">描述结果</text>
    <rect class="box" x="284" y="36" width="110" height="70" rx="10" stroke-width="1.5"/>
    <text class="ink" x="339" y="68" text-anchor="middle" font-size="13">演示 ≤10 分</text>
    <text class="muted" x="339" y="88" text-anchor="middle">无麦克风</text>
    <rect class="box" x="418" y="36" width="110" height="70" rx="10" stroke-width="1.5"/>
    <text class="ink" x="473" y="68" text-anchor="middle" font-size="13">审草稿 Skill</text>
    <text class="muted" x="473" y="88" text-anchor="middle">补规则边界</text>
    <rect class="pineb" x="552" y="36" width="150" height="70" rx="10" stroke-width="1.6"/>
    <text class="ink" x="627" y="68" text-anchor="middle" font-size="13">测试后再自动化</text>
    <text class="muted" x="627" y="88" text-anchor="middle">不要直接排程</text>
