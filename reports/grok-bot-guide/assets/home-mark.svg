  <rect class="p" width="720" height="200"/>
  <rect class="soft" x="36" y="36" width="200" height="128" rx="14" stroke-width="1.5"/>
  <text class="muted" x="136" y="88" text-anchor="middle" font-size="14">不是这个</text>
