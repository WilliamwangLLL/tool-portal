<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录 · AI 管理驾驶舱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1f2937}
.card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{font-size:22px;font-weight:700;margin-bottom:8px;text-align:center}
.subtitle{color:#6b7280;font-size:13px;text-align:center;margin-bottom:32px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
.field input{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;outline:none;transition:border-color .15s}
.field input:focus{border-color:#667eea}
button{width:100%;padding:12px;background:#667eea;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .15s}
button:hover{background:#5568d3}
button:disabled{background:#a5b4fc;cursor:not-allowed}
.error{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
<div class="card">
  <h1>AI 管理驾驶舱</h1>
  <div class="subtitle">请使用您的账号登录</div>
  <div class="error" id="err"></div>
  <form id="form">
    <div class="field">
      <label>用户名</label>
      <input type="text" id="username" autofocus autocomplete="username" required>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="submit">登 录</button>
  </form>
  <div class="footer">忘记密码请联系超级管理员</div>
</div>
<script>
const TOKEN_KEY='ops_token_v1';
if(localStorage.getItem(TOKEN_KEY)){
  // 已有 token,直接跳主页;主页会校验有效性,无效再跳回
  location.replace('ops.html');
}
const form=document.getElementById('form'),err=document.getElementById('err'),btn=document.getElementById('submit');
function showErr(m){err.textContent=m;err.style.display='block'}
function hideErr(){err.style.display='none'}
form.addEventListener('submit',async e=>{
  e.preventDefault();hideErr();btn.disabled=true;btn.textContent='登录中...';
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  try{
    const res=await fetch('/api/ops/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(!res.ok){throw new Error(data.error||'登录失败')}
    localStorage.setItem(TOKEN_KEY,data.token);
    localStorage.setItem('ops_user_v1',JSON.stringify(data.user));
    location.href='ops.html';
  }catch(ex){
    showErr(ex.message);btn.disabled=false;btn.textContent='登 录';
  }
});
</script>
</body>
</html>
