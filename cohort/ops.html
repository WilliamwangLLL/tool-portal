<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 管理驾驶舱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6;color:#1f2937;min-height:100vh}
.bar{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.bar h1{font-size:17px;font-weight:700}
.bar-right{display:flex;align-items:center;gap:14px;font-size:13px;flex-wrap:wrap}
.role-badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.5px}
.role-admin{background:#fef3c7;color:#92400e}
.role-chief{background:#ddd6fe;color:#5b21b6}
.role-stage_lead{background:#bfdbfe;color:#1e40af}
.role-ta{background:#bbf7d0;color:#14532d}
.btn{padding:6px 14px;border:1px solid #d1d5db;background:#fff;border-radius:8px;font-size:13px;cursor:pointer;color:#374151;font-family:inherit}
.btn:hover{background:#f9fafb}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#667eea;color:#fff;border-color:#667eea}
.btn-primary:hover{background:#5568d3}
.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}
.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:4px 10px;font-size:12px}
.view-toggle{display:flex;background:#f3f4f6;padding:3px;border-radius:8px;border:1px solid #e5e7eb}
.view-toggle button{border:none;background:transparent;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;border-radius:5px;color:#6b7280;font-family:inherit}
.view-toggle button.active{background:#fff;color:#667eea;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.wrap{padding:24px 28px;max-width:1400px;margin:0 auto}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid #e5e7eb}
.kpi-label{font-size:12px;color:#6b7280;font-weight:500}
.kpi-value{font-size:24px;font-weight:700;margin-top:6px;color:#111827}
.kpi-sub{font-size:11px;color:#9ca3af;margin-top:4px}
.tab-bar{display:flex;gap:4px;background:#fff;padding:4px;border-radius:10px;margin-bottom:16px;width:fit-content;border:1px solid #e5e7eb}
.tab{padding:7px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:#6b7280}
.tab.active{background:#667eea;color:#fff}
.section-row{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.section-title{font-size:14px;font-weight:700;color:#374151;display:flex;align-items:center;gap:10px}
.section-title .count{color:#9ca3af;font-weight:400;font-size:12px}
.empty{text-align:center;padding:40px;color:#9ca3af;background:#fff;border-radius:12px;border:1px dashed #e5e7eb}
.tbl-wrap{background:#fff;border-radius:12px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 14px;background:#f9fafb;font-size:12px;font-weight:600;color:#6b7280;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid #f3f4f6;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.fill-full{background:#dcfce7;color:#14532d;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.fill-partial{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.fill-empty{background:#e5e7eb;color:#6b7280;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.rate{font-weight:600}
.rate-good{color:#059669}
.rate-mid{color:#d97706}
.rate-bad{color:#dc2626}
.rate-na{color:#9ca3af}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal.lg{max-width:720px}
.modal h2{font-size:16px;font-weight:700;margin-bottom:4px}
.modal-meta{font-size:12px;color:#6b7280;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;font-weight:600;color:#374151}
.f .help{font-size:11px;color:#9ca3af;font-weight:400}
.f input,.f select,.f textarea{padding:8px 11px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:13px;outline:none;font-family:inherit;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#667eea}
.f textarea{min-height:60px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}
.toast.show{opacity:1}
.toast.error{background:#dc2626}
.role-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.status-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px}
.status-teaching{background:#dcfce7;color:#14532d}
.status-recruiting{background:#dbeafe;color:#1e40af}
.status-finished{background:#f3f4f6;color:#6b7280}
.modal-error{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:12px}
.audit-action{font-family:ui-monospace,monospace;font-size:11px;background:#f3f4f6;padding:2px 6px;border-radius:4px;color:#6b7280}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-container"></div>
<div class="toast" id="toast"></div>
<script>
const TOKEN_KEY='ops_token_v1',USER_KEY='ops_user_v1',API='/api/ops';
function getToken(){return localStorage.getItem(TOKEN_KEY)}
function clearAuth(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY)}
function toLogin(){clearAuth();location.replace('ops_login.html')}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' error':'');setTimeout(()=>t.classList.remove('show'),2200)}
async function api(path,opts={}){
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  const t=getToken();if(t)headers['X-Token']=t;
  const res=await fetch(API+path,{...opts,headers});
  if(res.status===401){toLogin();throw new Error('未登录')}
  return res;
}
const ROLE_LABEL={admin:'超级管理员',chief:'总负责人',stage_lead:'阶段负责人',ta:'二讲老师'};
const STAGES=['L2','L3','L4','L5'];
const TRACK_STATUS_LABEL={teaching:'教学中',recruiting:'招生中',finished:'已结课'};
const fmtPct=v=>v==null?'—':(v*100).toFixed(1)+'%';
const CURRENT_YEAR=new Date().getFullYear();
// 显示用:今年的日期省略年份(只 MM-DD),非今年的保留 YYYY-MM-DD
const fmtDate=s=>{
  if(!s)return '—';
  const d=s.length>10?s.slice(0,10):s;
  return d.slice(0,4)===String(CURRENT_YEAR)?d.slice(5):d;
};
// input[type=date] 用:必须 YYYY-MM-DD
const fmtDateISO=s=>s?(s.length>10?s.slice(0,10):s):'';
const fmtTime=s=>s?s.replace('T',' ').slice(0,16):'—';
const rateClass=(v,goodAt,badAt)=>{if(v==null)return 'rate-na';if(v>=goodAt)return 'rate-good';if(v<badAt)return 'rate-bad';return 'rate-mid'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let me=null;
let state={view:'brief',adminTab:'users',classTab:'ALL',sortKey:null,sortDir:'asc',
           fillFilter:'all',trendMetric:'in_progress',
           tsSortKey:'rate_retain',tsSortDir:'desc',
           scopeFilter:'all',adminStageTab:'ALL'};
let cache={classes:[],teachers:[],tracks:[],users:[],audit:[],teacherStats:[],trendData:null};

function daysSince(s){if(!s)return null;const d=new Date(s.length>10?s.slice(0,10):s);return Math.floor((new Date()-d)/86400000)}
// 二讲老师按 stage 过滤(stages 为空 = 跨全阶段通用)
// 生命周期 phase 标签
const PHASE_LABEL={recruiting:'招生中',teaching_early:'教学早期',teaching_stable:'教学稳定',renewal_window:'续报中',closing:'收尾',finished:'已结课'};
const PHASE_COLOR={recruiting:'#dbeafe',teaching_early:'#fef3c7',teaching_stable:'#dcfce7',renewal_window:'#bfdbfe',closing:'#e0e7ff',finished:'#f3f4f6'};
const PHASE_TEXT_COLOR={recruiting:'#1e40af',teaching_early:'#92400e',teaching_stable:'#14532d',renewal_window:'#1e3a8a',closing:'#3730a3',finished:'#6b7280'};
// 渲染指标单元格(根据 status 决定显示)
function rateTd(v,status,goodAt,badAt){
  if(status==='not_yet')return '<td title="未到统计期"><span style="color:#9ca3af">—</span></td>';
  if(v==null)return '<td><span style="color:#9ca3af">—</span></td>';
  const pct=(v*100).toFixed(1)+'%';
  if(status==='early')return `<td title="开课不到 15 天,数据未稳"><span style="color:#6b7280">${pct}</span> <span style="font-size:9px;background:#fef3c7;color:#92400e;padding:1px 5px;border-radius:3px">早期</span></td>`;
  return `<td class="rate ${rateClass(v,goodAt,badAt)}">${pct}</td>`;
}
function teacherIsForStage(t,stage){
  if(!stage)return true;
  if(!t.stages||!String(t.stages).trim())return true;
  return String(t.stages).split(',').map(s=>s.trim()).includes(stage);
}
function teacherOptionsForStage(stage,currentId){
  const filtered=(cache.teachers||[]).filter(t=>t.active&&teacherIsForStage(t,stage));
  // 已选中的二讲即使不属于此 stage 也要保留(避免 teacher_id 莫名丢失)
  if(currentId){
    const ex=cache.teachers.find(t=>t.id===currentId);
    if(ex&&!filtered.find(t=>t.id===ex.id))filtered.push(ex);
  }
  return filtered.map(t=>{
    const tag=t.stages?` [${t.stages}]`:' [全]';
    return `<option value="${t.id}" ${currentId===t.id?'selected':''}>${esc(t.name+tag)}</option>`;
  }).join('');
}

async function init(){
  if(!getToken()){toLogin();return}
  let res;try{res=await api('/me')}catch(e){return}
  if(!res.ok){toLogin();return}
  me=await res.json();
  if(me.must_change_pwd){renderForceChangePwd();return}
  // 二讲老师 (ta) 默认进经营视图 — AI 简报需要学员数据后才开放
  // 管理者 (admin/chief/stage_lead) 默认进 Daily Brief
  if(me.role==='ta'){
    state.view='ops';
    try{await loadOpsData()}catch(e){toast(e.message,1)}
  }else{
    state.view='brief';
  }
  render();
}

async function loadOpsData(){
  const [r1,r2]=await Promise.all([api('/classes'),api('/teachers?include_inactive=1')]);
  cache.classes=await r1.json();cache.teachers=await r2.json();
}

async function loadAdminData(){
  const tasks=[api('/teachers?include_inactive=1'),api('/tracks?status=all'),api('/teacher_stats')];
  if(me.role==='admin'){tasks.push(api('/users'));tasks.push(api('/audit_log?limit=200'))}
  const results=await Promise.all(tasks);
  cache.teachers=await results[0].json();
  cache.tracks=await results[1].json();
  cache.teacherStats=await results[2].json();
  if(me.role==='admin'){
    cache.users=await results[3].json();
    cache.audit=await results[4].json();
  }
}

// ========== 强制改密码 ==========
function renderForceChangePwd(){
  document.getElementById('app').innerHTML=`
    <div class="modal-bg" style="background:#f3f4f6">
      <div class="modal">
        <h2>🔐 首次登录,请修改密码</h2>
        <div class="modal-meta">为了账号安全,系统要求你必须先设置一个新密码,不能继续使用初始密码。</div>
        <div class="modal-error" id="fcp-err" style="display:none"></div>
        <div class="form-grid">
          <div class="f full"><label>当前密码 (管理员给你的初始密码)</label><input type="password" id="fcp-old" autofocus></div>
          <div class="f full"><label>新密码 <span class="help">至少 6 位</span></label><input type="password" id="fcp-new"></div>
          <div class="f full"><label>再输一遍新密码</label><input type="password" id="fcp-new2"></div>
        </div>
        <div class="modal-actions"><button class="btn btn-primary" onclick="submitForceChangePwd()">设置新密码并继续</button></div>
      </div>
    </div>`;
}
async function submitForceChangePwd(){
  const o=document.getElementById('fcp-old').value;
  const n=document.getElementById('fcp-new').value;
  const n2=document.getElementById('fcp-new2').value;
  const err=document.getElementById('fcp-err');
  function showErr(m){err.textContent=m;err.style.display='block'}
  if(!o||!n){showErr('请填写');return}
  if(n!==n2){showErr('两次新密码不一致');return}
  if(n.length<6){showErr('新密码至少 6 位');return}
  try{
    const res=await api('/change_password',{method:'POST',body:JSON.stringify({old_password:o,new_password:n})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'修改失败');
    me.must_change_pwd=false;localStorage.setItem(USER_KEY,JSON.stringify(me));
    toast('密码已设置,欢迎使用');
    await loadOpsData();render();
  }catch(e){showErr(e.message)}
}

// ========== 主框架 ==========
function visibleStagesForUser(){
  if(me.role==='stage_lead'&&me.managed_stages){
    return me.managed_stages.split(',').map(s=>s.trim()).filter(Boolean);
  }
  return STAGES;
}
function render(){
  const canAdmin=['admin','chief','stage_lead'].includes(me.role);
  document.getElementById('app').innerHTML=`
    <div class="bar">
      <h1>📊 AI 管理驾驶舱</h1>
      <div class="bar-right">
        <div class="view-toggle">
          ${me.role!=='ta'?`<button class="${state.view==='brief'?'active':''}" onclick="switchView('brief')">📅 今日</button>`:''}
          <button class="${state.view==='ops'?'active':''}" onclick="switchView('ops')">📊 经营视图</button>
          ${canAdmin?`<button class="${state.view==='admin'?'active':''}" onclick="switchView('admin')">⚙️ 管理后台</button>`:''}
        </div>
        <span>${esc(me.real_name||me.username)}</span>
        <span class="role-badge role-${me.role}">${ROLE_LABEL[me.role]}${me.managed_stages?' · '+esc(me.managed_stages):''}</span>
        <button class="btn" onclick="openChangePwd()">修改密码</button>
        <button class="btn" onclick="doLogout()">退出</button>
      </div>
    </div>
    <div class="wrap" id="content"></div>`;
  if(state.view==='brief')renderBrief();
  else if(state.view==='admin')renderAdmin();
  else renderOps();
}

async function switchView(v){
  if(v==='brief'&&me.role==='ta'){
    toast('AI 智能简报开发中,等学员数据接入后对二讲老师开放',1);
    return;
  }
  state.view=v;
  document.getElementById('content')&&(document.getElementById('content').innerHTML='<div class="empty">加载中...</div>');
  if(v==='admin'){
    try{await loadAdminData()}catch(e){toast(e.message,1)}
  }else if(v==='ops'){
    try{await loadOpsData()}catch(e){toast(e.message,1)}
  }
  render();
}

// ========== Daily Brief (个性化登录首屏) ==========
async function renderBrief(){
  const c=document.getElementById('content');
  // 先检查 cache, 没有就实时拉
  if(cache.brief&&cache.brief._loadedAt&&(Date.now()-cache.brief._loadedAt)<300000){
    renderBriefContent();return;
  }
  c.innerHTML=`<div style="max-width:880px;margin:0 auto;padding:60px 20px;text-align:center">
    <div style="font-size:40px;animation:pulse 1.5s ease-in-out infinite">🤖</div>
    <div style="margin-top:16px;color:#6b7280">正在为你生成今日驾驶舱<br><span style="font-size:11px;color:#9ca3af">首次访问需 60-120 秒(等 AI 算),之后每天缓存秒开</span></div>
  </div>`;
  try{
    const res=await api('/daily_brief');
    const d=await res.json();
    d._loadedAt=Date.now();
    cache.brief=d;
    renderBriefContent();
  }catch(e){
    c.innerHTML='<div style="max-width:880px;margin:60px auto;padding:30px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;color:#991b1b">加载失败: '+esc(e.message)+'<br><br><button class="btn" onclick="renderBrief()">重试</button></div>';
  }
}

async function refreshBrief(){
  cache.brief=null;
  const c=document.getElementById('content');
  c.innerHTML=`<div style="max-width:880px;margin:0 auto;padding:60px 20px;text-align:center">
    <div style="font-size:40px;animation:pulse 1.5s ease-in-out infinite">🤖</div>
    <div style="margin-top:16px;color:#6b7280">AI 在重新计算今日重点工作...</div>
  </div>`;
  try{
    const res=await api('/daily_brief?force=1');
    const d=await res.json();
    d._loadedAt=Date.now();
    cache.brief=d;
    toast('已刷新');
    renderBriefContent();
  }catch(e){
    toast('刷新失败: '+e.message,1);
    renderBriefContent();
  }
}

const PRI_ICON={P0:'🚨',P1:'⚠️',P2:'✅'};
const PRI_COLOR={P0:'#dc2626',P1:'#d97706',P2:'#059669'};
const PRI_BG={P0:'#fef2f2',P1:'#fffbeb',P2:'#f0fdf4'};

function fbKey(date,idx,type){return `fb_${type}_${date||'today'}_${idx}`}
function fbRated(date,idx,type){return localStorage.getItem(fbKey(date,idx,type))}
function fbMark(date,idx,type,kind){localStorage.setItem(fbKey(date,idx,type),kind+'_'+Date.now())}

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

async function rateBriefTask(idx,kind){
  const date=todayStr();
  if(fbRated(date,idx,'brief_task')){toast('已评过',1);return}
  const task=(cache.brief&&cache.brief.today_tasks||[])[idx];
  if(kind==='good'){
    try{
      await api('/feedback',{method:'POST',body:JSON.stringify({
        feedback_type:'brief_task',context_key:date,item_index:idx,rating:5,
        ai_output:task||null,
      })});
      fbMark(date,idx,'brief_task','good');
      toast('感谢反馈 👍');
      renderBriefContent();
    }catch(e){toast(e.message,1)}
  }else{
    // 展开原因选择
    document.getElementById(`bad-${idx}`).style.display='flex';
  }
}
async function submitBadFeedback(idx,reason){
  const date=todayStr();
  const task=(cache.brief&&cache.brief.today_tasks||[])[idx];
  const commentEl=document.getElementById(`bad-comment-${idx}`);
  const comment=commentEl?commentEl.value.trim():null;
  try{
    await api('/feedback',{method:'POST',body:JSON.stringify({
      feedback_type:'brief_task',context_key:date,item_index:idx,rating:1,
      reason,comment:comment||null,ai_output:task||null,
    })});
    fbMark(date,idx,'brief_task','bad:'+reason);
    toast('感谢反馈,我会改 prompt');
    renderBriefContent();
  }catch(e){toast(e.message,1)}
}
async function rateBriefOverall(stars){
  const date=todayStr();
  if(fbRated(date,-1,'brief_overall')){toast('今天已评过整体',1);return}
  const commentEl=document.getElementById('bo-comment');
  const comment=commentEl?commentEl.value.trim():null;
  try{
    await api('/feedback',{method:'POST',body:JSON.stringify({
      feedback_type:'brief_overall',context_key:date,item_index:-1,rating:stars,
      comment:comment||null,
      ai_output:cache.brief?{tasks_count:(cache.brief.today_tasks||[]).length,monthly:cache.brief.monthly_summary}:null,
    })});
    fbMark(date,-1,'brief_overall','rated:'+stars);
    toast('感谢评分 ⭐');
    renderBriefContent();
  }catch(e){toast(e.message,1)}
}

function renderBriefContent(){
  const c=document.getElementById('content');
  const d=cache.brief||{};
  const tasks=d.today_tasks||[];
  const weekly=d.weekly_goal;
  const monthly=d.monthly_summary;
  const today=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const todayKey=todayStr();

  let h=`<div style="max-width:880px;margin:0 auto">
    <div style="margin-bottom:28px">
      <div style="font-size:13px;color:#9ca3af;letter-spacing:0.5px">${today}</div>
      <div style="font-size:26px;font-weight:700;margin-top:6px;color:#111827">${esc(me.real_name||me.username)},今日驾驶舱</div>
      <div style="font-size:13px;color:#6b7280;margin-top:4px">${ROLE_LABEL[me.role]}${me.managed_stages?' · '+esc(me.managed_stages):''}</div>
    </div>

      h+=`<div style="border-left:3px solid ${c};padding:14px 18px;background:${bg};border-radius:0 10px 10px 0;margin:${i>0?'12px':'0'} 0 0">

            <span style="font-size:15px;font-weight:600;color:#1f2937">${esc(t.title||'')}</span>

        ${(t.evidence&&t.evidence.length)?`<div style="margin-top:8px;font-size:12px;color:#6b7280;line-height:1.7">${t.evidence.map(e=>'↳ '+esc(e)).join('<br>')}</div>`:''}
        ${t.action?`<div style="margin-top:10px;font-size:13px;color:#374151;background:rgba(255,255,255,0.6);padding:8px 12px;border-radius:6px;border:1px solid rgba(0,0,0,0.04)"><b>建议:</b> ${esc(t.action)}</div>`:''}
        <div id="bad-${i}" style="display:none;margin-top:10px;padding:10px;background:#fef2f2;border-radius:8px;flex-wrap:wrap;gap:6px">
          <div style="width:100%;font-size:12px;color:#991b1b;margin-bottom:6px;font-weight:600">👎 哪里不好? (点一个)</div>
          ${['太空了/没数据','数据不准','时机不对','已经做了','看不懂','其他'].map(r=>
            `<button onclick="submitBadFeedback(${i},'${esc(r)}')" style="background:#fff;border:1px solid #fecaca;color:#991b1b;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;margin-right:6px">${esc(r)}</button>`
          ).join('')}
          <input id="bad-comment-${i}" placeholder="可选: 详细说说" style="flex:1;min-width:200px;padding:5px 10px;border:1px solid #fecaca;border-radius:6px;font-size:12px;margin-top:6px;width:100%">

    });
  }
  h+='</div>';

  if(weekly&&weekly.title){
    h+=`<div style="background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px 28px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)">
      <div style="font-size:15px;font-weight:700;margin-bottom:14px;color:#111827">🎯 本周聚焦</div>
      <div style="font-size:15px;font-weight:600;color:#1f2937">${esc(weekly.title)}</div>
      ${weekly.progress?`<div style="display:inline-block;margin-top:10px;background:#dcfce7;color:#14532d;padding:4px 12px;border-radius:6px;font-size:13px;font-weight:600">进度: ${esc(weekly.progress)}</div>`:''}
      ${weekly.details?`<div style="font-size:12px;color:#6b7280;margin-top:8px;line-height:1.7">${esc(weekly.details)}</div>`:''}
    </div>`;
  }

  if(monthly){
    h+=`<div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:16px;padding:24px 28px;box-shadow:0 4px 16px rgba(102,126,234,0.20)">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;letter-spacing:1px;opacity:0.85">💼 本月一句话</div>
      <div style="font-size:16px;line-height:1.7;font-weight:500">${esc(monthly)}</div>
    </div>`;
  }

  // 整体评分 (每天一次)
  const overallRated=fbRated(todayKey,-1,'brief_overall');
  if(tasks.length>0){
    if(overallRated){
      h+=`<div style="margin-top:16px;text-align:center;color:#9ca3af;font-size:12px">✓ 今天的整体评分已收到, 谢谢</div>`;
    }else{
      h+=`<div style="margin-top:16px;background:#f9fafb;border:1px dashed #d1d5db;border-radius:12px;padding:20px;text-align:center">
        <div style="font-size:13px;color:#374151;margin-bottom:10px">这份简报对你今天有帮助吗?</div>
        <div style="display:flex;justify-content:center;gap:14px;font-size:30px;margin-bottom:10px">
          <span onclick="rateBriefOverall(1)" style="cursor:pointer;transition:transform 0.15s" onmouseover="this.style.transform='scale(1.3)'" onmouseout="this.style.transform='scale(1)'" title="完全没帮助">😡</span>
          <span onclick="rateBriefOverall(2)" style="cursor:pointer;transition:transform 0.15s" onmouseover="this.style.transform='scale(1.3)'" onmouseout="this.style.transform='scale(1)'" title="不太行">😕</span>
          <span onclick="rateBriefOverall(3)" style="cursor:pointer;transition:transform 0.15s" onmouseover="this.style.transform='scale(1.3)'" onmouseout="this.style.transform='scale(1)'" title="一般">😐</span>
          <span onclick="rateBriefOverall(4)" style="cursor:pointer;transition:transform 0.15s" onmouseover="this.style.transform='scale(1.3)'" onmouseout="this.style.transform='scale(1)'" title="挺有用">😊</span>
          <span onclick="rateBriefOverall(5)" style="cursor:pointer;transition:transform 0.15s" onmouseover="this.style.transform='scale(1.3)'" onmouseout="this.style.transform='scale(1)'" title="非常棒">😍</span>
        </div>
        <input id="bo-comment" placeholder="(可选) 任何建议?" style="width:80%;max-width:400px;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;margin-top:6px">
      </div>`;
    }
  }

  // 元信息
  const modeLabel=d.mode==='ai'?'✨ AI 生成':d.mode==='rules'?'⚠️ 简化版(AI 不可用)':d.mode==='empty'?'(无数据)':'';
  const cachedTag=d.cached?' · 当日缓存':'';
  const genAt=d.generated_at?d.generated_at.replace('T',' ').slice(0,16):'';
  h+=`<div style="margin-top:16px;font-size:11px;color:#9ca3af;text-align:center">${modeLabel}${cachedTag}${genAt?' · '+genAt:''}</div>`;

  if(d.parse_error||d.ai_error){
    h+=`<div style="margin-top:8px;font-size:10px;color:#ef4444;text-align:center;opacity:0.7">${esc(d.parse_error||d.ai_error||'')}</div>`;
  }

  h+='</div>';
  c.innerHTML=h;
}

// ========== 经营视图 ==========
function visibleStages(){
  // 全员可看全部 stage tab;stage_lead 跨阶段学习,但编辑权限受 isMyClass 控制
  return STAGES;
}
function isMyClass(c){
  if(['admin','chief'].includes(me.role))return true;
  if(me.role==='stage_lead'){
    const my=(me.managed_stages||'').split(',').map(s=>s.trim()).filter(Boolean);
    return my.includes(c.stage);
  }
  if(me.role==='ta')return c.owner_user_id===me.id;
  return false;
}
function isMyTrack(t){
  if(['admin','chief'].includes(me.role))return true;
  if(me.role==='stage_lead'){
    const my=(me.managed_stages||'').split(',').map(s=>s.trim()).filter(Boolean);
    return my.includes(t.stage);
  }
  return false;
}
function canModifyTeacher(t){
  if(['admin','chief'].includes(me.role))return true;
  if(me.role!=='stage_lead')return false;
  // 跨全阶段二讲(stages 空)不能动
  if(!t.stages||!String(t.stages).trim())return false;
  const my=(me.managed_stages||'').split(',').map(s=>s.trim()).filter(Boolean);
  const ts=String(t.stages).split(',').map(s=>s.trim()).filter(Boolean);
  return ts.length>0 && ts.every(s=>my.includes(s));
}
function setScopeFilter(s){state.scopeFilter=s;renderOps()}
function getFilteredClasses(){
  let cls=state.classTab==='ALL'?cache.classes:cache.classes.filter(c=>c.stage===state.classTab);
  if(state.scopeFilter==='mine')cls=cls.filter(c=>isMyClass(c));
  if(state.fillFilter==='overdue')cls=cls.filter(c=>c.is_overdue);
  else if(state.fillFilter==='full')cls=cls.filter(c=>c.fill_status==='full');
  else if(state.fillFilter==='partial')cls=cls.filter(c=>c.fill_status==='partial');
  else if(state.fillFilter==='empty')cls=cls.filter(c=>c.fill_status==='empty');
  return applySort(cls);
}
function setFillFilter(f){state.fillFilter=f;renderOps()}
function applySort(arr){
  if(!state.sortKey)return arr;
  const k=state.sortKey,d=state.sortDir==='desc'?-1:1;
  return [...arr].sort((a,b)=>{
    let va=a[k],vb=b[k];
    const aE=va==null||va==='',bE=vb==null||vb==='';
    if(aE&&bE)return 0;
    if(aE)return 1;            // 空值永远排末尾,无视方向
    if(bE)return -1;
    if(typeof va==='number'&&typeof vb==='number')return (va-vb)*d;
    return String(va).localeCompare(String(vb),'zh-CN')*d;
  });
}
function setSort(k){
  if(state.sortKey===k){
    if(state.sortDir==='asc'){state.sortDir='desc'}
    else{state.sortKey=null;state.sortDir='asc'}  // 第三次点击恢复默认
  }else{state.sortKey=k;state.sortDir='asc'}
  renderOps();
}
function sortArrow(k){
  if(state.sortKey!==k)return '<span style="opacity:.25;font-size:9px">⇅</span>';
  return state.sortDir==='asc'?'<span style="color:#667eea">▲</span>':'<span style="color:#667eea">▼</span>';
}
function renderOps(){
  const stages=visibleStages();
  const cls=getFilteredClasses();
  const showSummary=['admin','chief','stage_lead'].includes(me.role);
  const showTabs=stages.length>1;
  let h='';
  if(showSummary){
    // 应填未填:基于生命周期判断,只算"该填没填"的
    const overdue=cls.filter(c=>c.is_overdue);
    // KPI 聚合只对达到统计期的班级求和(避免招生中/早期班拖低数字)
    const validOpen=cls.filter(c=>['valid','final'].includes(c.rate_open_status));
    const validRenew=cls.filter(c=>['valid','final'].includes(c.rate_renew_status));
    const validRetain=cls.filter(c=>['valid','final'].includes(c.rate_retain_status));
    const sumPaid=arr=>arr.reduce((a,c)=>a+(c.paid||0),0);
    const sumA=arr=>arr.reduce((a,c)=>a+(c.A||0),0);
    const sumN=arr=>arr.reduce((a,c)=>a+(c.N||0),0);
    const opPaid=sumPaid(validOpen),opA=sumA(validOpen);
    const reA=sumA(validRenew),reN=sumN(validRenew);
    const rtPaid=sumPaid(validRetain),rtN=sumN(validRetain);
    const inProgress=cls.reduce((a,c)=>a+(c.paid||0)-(c.refund_count||0)-(c.delay_count||0),0);
    const fillCardStyle=overdue.length>0
      ?'background:#fef2f2;border-color:#fecaca;cursor:pointer'
      :'background:#f0fdf4;border-color:#bbf7d0;cursor:pointer';
    const fillTitle=overdue.length>0?'⚠️ 应填未填':'✅ 填报到位';
    const fillColor=overdue.length>0?'#dc2626':'#059669';
    h+=`<div class="summary">
      <div class="kpi" style="${fillCardStyle}" onclick="setFillFilter('${overdue.length>0?'overdue':'all'}')" title="${overdue.length>0?'点击只看应填未填的班级(招生中的不算)':'所有班级在该填的时候都填了'}">
        <div class="kpi-label" style="color:${fillColor}">${fillTitle}</div>
        <div class="kpi-value" style="color:${fillColor}">${overdue.length}</div>
        <div class="kpi-sub">${overdue.length>0?'班该填没填(基于生命周期)':'数据按时填报'}</div>
      </div>
      <div class="kpi"><div class="kpi-label">运行中班级数</div><div class="kpi-value">${cls.length}</div><div class="kpi-sub">${state.classTab==='ALL'?'全部阶段':state.classTab}${state.fillFilter!=='all'?'·已筛选':''}</div></div>
      <div class="kpi"><div class="kpi-label">在读人数 (估算)</div><div class="kpi-value">${inProgress}</div><div class="kpi-sub">缴费 - 退费 - 延期</div></div>
      <div class="kpi"><div class="kpi-label">平均开课率</div><div class="kpi-value ${rateClass(opPaid?opA/opPaid:null,.7,.5)}">${fmtPct(opPaid?opA/opPaid:null)}</div><div class="kpi-sub" title="只算开课>15天的班级">${validOpen.length} 个班 · ${opA}/${opPaid}</div></div>
      <div class="kpi"><div class="kpi-label">平均续报率</div><div class="kpi-value ${rateClass(reA?reN/reA:null,.5,.3)}">${fmtPct(reA?reN/reA:null)}</div><div class="kpi-sub" title="只算续报通道已开的班级">${validRenew.length} 个班 · ${reN}/${reA}</div></div>
      <div class="kpi"><div class="kpi-label">平均留存率</div><div class="kpi-value ${rateClass(rtPaid?rtN/rtPaid:null,.4,.2)}">${fmtPct(rtPaid?rtN/rtPaid:null)}</div><div class="kpi-sub" title="只算续报通道已开的班级">${validRetain.length} 个班 · ${rtN}/${rtPaid}</div></div>
    </div>`;
  }
  if(showTabs){
    h+='<div class="tab-bar">';
    h+=`<div class="tab ${state.classTab==='ALL'?'active':''}" onclick="setClassTab('ALL')">全部</div>`;
    stages.forEach(s=>h+=`<div class="tab ${state.classTab===s?'active':''}" onclick="setClassTab('${s}')">${s}</div>`);
    h+='</div>';
  }
  const canAnalyze=['admin','chief','stage_lead'].includes(me.role);
  // stage_lead 专属:范围切换(全部/仅我管的)
  if(me.role==='stage_lead'){
    const scopeBtns=[['all','📚 全部 (含其他阶段)'],['mine','✏️ 仅我管的']];
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;background:#f3f4f6;padding:8px 12px;border-radius:8px">
      <span style="color:#6b7280;font-size:12px">范围:</span>
      ${scopeBtns.map(([k,l])=>`<button class="btn btn-sm ${state.scopeFilter===k?'btn-primary':''}" onclick="setScopeFilter('${k}')">${l}</button>`).join('')}
      <span style="color:#9ca3af;font-size:11px;margin-left:4px">${state.scopeFilter==='all'?'你能看全部 4 个阶段的数据用于学习,但只能编辑自己管的阶段':'仅显示你能编辑的班级'}</span>
    </div>`;
  }
  // 填报筛选条
  const fillBtns=[['all','全部'],['overdue','⚠️ 应填未填'],['full','完整'],['partial','部分'],['empty','空白']];
  h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <span style="color:#6b7280;font-size:12px">填报状态:</span>
    ${fillBtns.map(([k,l])=>`<button class="btn btn-sm ${state.fillFilter===k?'btn-primary':''}" onclick="setFillFilter('${k}')">${l}</button>`).join('')}
  </div>`;
  h+=`<div class="section-row">
    <div class="section-title">📋 ${me.role==='ta'?'我负责的班级':'班级清单'} <span class="count">${cls.length} 个${state.fillFilter!=='all'?' · 已筛选':''}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${canAnalyze?`<button class="btn btn-primary" onclick="openAiAnalysis()">🤖 AI 经营分析</button>`:''}
      ${canAnalyze?`<button class="btn" onclick="openTrends()">📈 查看趋势</button>`:''}
      <button class="btn" onclick="downloadCsv()">⬇ 导出 Excel (CSV)</button>
    </div>
  </div>`;
  if(cls.length===0){
    h+=`<div class="empty">${me.role==='ta'?'暂无你负责的班级,请联系管理员分配。':'暂无班级数据,管理员可在「管理后台 → 轨次班级管理」中新建。'}</div>`;
  }else{
    const sortable=(k,label,extra)=>`<th onclick="setSort('${k}')" style="cursor:pointer;user-select:none" ${extra||''}>${label} ${sortArrow(k)}</th>`;
    h+=`<div class="tbl-wrap"><table>
      <thead><tr>
        ${sortable('stage','阶段')}
        ${sortable('start_date','开课日')}
        ${sortable('renewal_date','续报日')}
        ${sortable('end_date','结课日')}
        ${sortable('price_per_student','价位')}
        ${sortable('teacher_name','二讲')}
        ${sortable('owner_real_name','负责人')}
        ${sortable('paid','缴费','title="本阶段缴费人数 = 上阶段续报人数"')}
        ${sortable('A','前4次','title="本阶段前 4 次课实际到课人头"')}
        ${sortable('N','续报','title="本阶段缴费且续到下阶段"')}
        ${sortable('rate_open','开课率')}
        ${sortable('rate_renew','续报率')}
        ${sortable('rate_retain','留存率')}
        ${sortable('fill_status','填报')}
        ${sortable('updated_at','更新')}
        <th></th>
      </tr></thead><tbody>`;
    cls.forEach(c=>{
      const fc=c.fill_status==='full'?'fill-full':c.fill_status==='partial'?'fill-partial':'fill-empty';
      const fl=c.fill_status==='full'?'完整':c.fill_status==='partial'?'部分':'空白';
      const days=daysSince(c.start_date);
      const fillTitle=c.fill_status==='empty'&&days!=null?`title="距开课已 ${days} 天,该填了"`:'';
      const upd=c.updated_at?esc(c.updated_by_name||'')+' '+c.updated_at.slice(5,16):'—';
      const phaseTag=c.lifecycle_phase?`<br><span style="font-size:9px;background:${PHASE_COLOR[c.lifecycle_phase]};color:${PHASE_TEXT_COLOR[c.lifecycle_phase]};padding:1px 6px;border-radius:3px;font-weight:600;letter-spacing:.3px;display:inline-block;margin-top:2px">${PHASE_LABEL[c.lifecycle_phase]||c.lifecycle_phase}</span>`:'';
      const overdueTag=c.is_overdue?' <span style="background:#fee2e2;color:#991b1b;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:700">应填</span>':'';
      h+=`<tr>
        <td><b>${c.stage}</b>${phaseTag}</td>
        <td>${fmtDate(c.start_date)}</td>
        <td>${fmtDate(c.renewal_date)}</td>
        <td>${fmtDate(c.end_date)}</td>
        <td>${c.price_per_student?'¥'+c.price_per_student:'—'}</td>
        <td>${esc(c.teacher_name)||'<span style="color:#9ca3af">未指定</span>'}</td>
        <td>${esc(c.owner_real_name||c.owner_username)||'<span style="color:#9ca3af">未分配</span>'}</td>
        <td>${c.paid||0}</td><td>${c.A||0}</td><td>${c.N||0}</td>
        ${rateTd(c.rate_open,c.rate_open_status,.7,.5)}
        ${rateTd(c.rate_renew,c.rate_renew_status,.5,.3)}
        ${rateTd(c.rate_retain,c.rate_retain_status,.4,.2)}
        <td><span class="${fc}" ${fillTitle}>${fl}</span>${overdueTag}</td>
        <td style="font-size:11px;color:#6b7280">${upd}</td>
        <td>${isMyClass(c)?`<button class="btn btn-primary btn-sm" onclick="editClass(${c.id})">编辑</button>`:'<span style="color:#9ca3af;font-size:11px" title="此班级在其他阶段,你只能查看不能修改">仅参考</span>'}</td>
      </tr>`;
      if(c.note&&c.note.trim()){
        h+=`<tr><td colspan="16" style="background:#fffbeb;font-size:12px;color:#78350f;padding:6px 14px;border-bottom:1px solid #fef3c7">📝 <b>${esc(c.teacher_name)||c.stage}</b>: ${esc(c.note)}</td></tr>`;
      }
    });
    h+='</tbody></table></div>';
  }
  document.getElementById('content').innerHTML=h;
}
function setClassTab(s){state.classTab=s;renderOps()}

function downloadCsv(){
  const t=getToken();
  // CSV 下载需要带 X-Token,但 <a download> 不能加 header,只能用 fetch + blob
  fetch(API+'/classes.csv',{headers:{'X-Token':t}})
    .then(r=>r.ok?r.blob():Promise.reject(r.statusText))
    .then(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download='classes_'+new Date().toISOString().slice(0,16).replace(/[T:]/g,'')+'.csv';

function renderTrendChart(){
  const data=cache.trendData||{};
  const metric=state.trendMetric;
  const isPct=metric.startsWith('rate_');
  const stages=['L2','L3','L4','L5'];
  const colors={L2:'#667eea',L3:'#10b981',L4:'#f59e0b',L5:'#ef4444'};
  const allPts=[];stages.forEach(s=>(data[s]||[]).forEach(p=>{if(p[metric]!=null)allPts.push({stage:s,...p})}));
  if(allPts.length===0){document.getElementById('trend-chart').innerHTML='<div class="empty">该指标暂无趋势数据</div>';return}
  const dates=[...new Set(allPts.map(p=>p.date))].sort();
  let max=Math.max(...allPts.map(p=>p[metric]));
  if(isPct)max=Math.min(1,max*1.15);else max=Math.ceil(max*1.15);
  if(max===0)max=1;
  const W=780,H=340,ML=60,MR=20,MT=40,MB=50;
  const innerW=W-ML-MR,innerH=H-MT-MB;
  const xPos=d=>ML+(dates.indexOf(d)/Math.max(1,dates.length-1))*innerW;
  const yPos=v=>MT+innerH-(v/max)*innerH;
  let svg='';
  // y grid + labels
  for(let i=0;i<=5;i++){
    const y=MT+innerH-(i/5)*innerH;
    const v=max*i/5;
    const lbl=isPct?(v*100).toFixed(0)+'%':Math.round(v).toLocaleString();
    svg+=`<line x1="${ML}" x2="${ML+innerW}" y1="${y}" y2="${y}" stroke="#e5e7eb"/>`;
    svg+=`<text x="${ML-8}" y="${y+4}" font-size="10" fill="#6b7280" text-anchor="end">${lbl}</text>`;
  }
  // x labels
  const step=Math.max(1,Math.floor(dates.length/8));
  dates.forEach((d,i)=>{
    if(i%step===0||i===dates.length-1){
      svg+=`<text x="${xPos(d)}" y="${MT+innerH+18}" font-size="10" fill="#6b7280" text-anchor="middle">${d.slice(5)}</text>`;
    }
  });
  // legend
  let lx=ML;
  stages.forEach(s=>{
    if(!(data[s]||[]).length)return;
    svg+=`<line x1="${lx}" x2="${lx+18}" y1="${MT-20}" y2="${MT-20}" stroke="${colors[s]}" stroke-width="3"/>`;
    svg+=`<text x="${lx+22}" y="${MT-16}" font-size="11" fill="#374151" font-weight="600">${s}</text>`;
    lx+=58;
  });
  // lines
  stages.forEach(s=>{
    const pts=(data[s]||[]).filter(p=>p[metric]!=null);
    if(!pts.length)return;
    const path=pts.map((p,i)=>`${i===0?'M':'L'} ${xPos(p.date)} ${yPos(p[metric])}`).join(' ');
    svg+=`<path d="${path}" fill="none" stroke="${colors[s]}" stroke-width="2.2"/>`;
    pts.forEach(p=>{
      const v=isPct?(p[metric]*100).toFixed(1)+'%':Math.round(p[metric]).toLocaleString();
      svg+=`<circle cx="${xPos(p.date)}" cy="${yPos(p[metric])}" r="3.5" fill="${colors[s]}" stroke="#fff" stroke-width="1.5"><title>${s} ${p.date}: ${v}</title></circle>`;
    });
  });
  document.getElementById('trend-chart').innerHTML=`<svg width="${W}" height="${H}" style="display:block;max-width:100%">${svg}</svg>`;
}

// ========== AI 经营分析 ==========
function md2html(s){
  // 极简 markdown:支持 # ## ###、**粗体**、- 列表、表格、代码块、空行分段
  s=String(s||'').replace(/<think>[\s\S]*?<\/think>\s*/g,''); // 防御性:再剥一次 think
  const lines=s.split('\n');
  let out=[],inList=false,inCode=false,buf=[],i=0;
  function flush(){if(buf.length){out.push('<p>'+buf.join('<br>')+'</p>');buf=[]}}
  function closeList(){if(inList){out.push('</ul>');inList=false}}
  function isTableSep(l){return /^\s*\|?[\s:-]*(\|[\s:-]*)+\|?\s*$/.test(l)&&l.indexOf('-')>=0}
  while(i<lines.length){
    const line=lines[i];
    if(line.startsWith('```')){
      if(inCode){out.push('</code></pre>');inCode=false}
      else{flush();closeList();out.push('<pre><code>');inCode=true}
      i++;continue;
    }
    if(inCode){out.push(esc(line));i++;continue}
    // 表格: 当前行包含 | 且下一行是分隔行
    if(line.indexOf('|')>=0&&i+1<lines.length&&isTableSep(lines[i+1])){
      flush();closeList();
      const headers=line.split('|').map(c=>c.trim()).filter((c,idx,arr)=>!(idx===0&&!c)&&!(idx===arr.length-1&&!c));
      i+=2;
      let rows=[];
      while(i<lines.length&&lines[i].indexOf('|')>=0&&lines[i].trim()){
        const r=lines[i].split('|').map(c=>c.trim()).filter((c,idx,arr)=>!(idx===0&&!c)&&!(idx===arr.length-1&&!c));
        rows.push(r);i++;
      }
      out.push('<table style="border-collapse:collapse;margin:10px 0;font-size:13px"><thead><tr>'+headers.map(h=>`<th style="border:1px solid #e5e7eb;padding:6px 10px;background:#f9fafb;text-align:left">${inline(h)}</th>`).join('')+'</tr></thead><tbody>');
      rows.forEach(r=>{out.push('<tr>'+r.map(c=>`<td style="border:1px solid #e5e7eb;padding:6px 10px">${inline(c)}</td>`).join('')+'</tr>')});
      out.push('</tbody></table>');
      continue;
    }
    if(line.startsWith('### ')){flush();closeList();out.push('<h3>'+inline(line.slice(4))+'</h3>');i++;continue}
    if(line.startsWith('## ')){flush();closeList();out.push('<h2>'+inline(line.slice(3))+'</h2>');i++;continue}
    if(line.startsWith('# ')){flush();closeList();out.push('<h1>'+inline(line.slice(2))+'</h1>');i++;continue}
    if(line.match(/^[-*] /)){
      flush();
      if(!inList){out.push('<ul>');inList=true}
      out.push('<li>'+inline(line.slice(2))+'</li>');
      i++;continue;
    }
    if(line.trim()===''){flush();closeList();i++;continue}
    buf.push(inline(line));
    i++;
  }
  flush();closeList();if(inCode)out.push('</code></pre>');
  return out.join('\n');
}
function inline(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
}

// 通用流式 AI 消费器:把 SSE 流读出来,实时渲染到指定容器
async function streamAi(path, body, metaId, contentId){
  const startedAt=new Date();
  const metaEl=document.getElementById(metaId);
  const contentEl=document.getElementById(contentId);
  let raw='', meta={}, lastUpdate=0;

  function updateDisplay(forceFinal){
    // 剥已闭合的 <think>
    const cleaned=raw.replace(/<think>[\s\S]*?<\/think>\s*/g,'');
    // 是否在未闭合的 <think> 中
    const lastThink=raw.lastIndexOf('<think>');
    const lastEnd=raw.lastIndexOf('</think>');
    const inThink=lastThink>lastEnd&&!cleaned.trim();
    if(inThink){
      contentEl.innerHTML=`<div style="text-align:center;padding:40px;color:#9ca3af">
        <div style="font-size:28px;animation:pulse 1.5s infinite">🤔</div>
        <div style="margin-top:12px;font-size:13px">AI 思考中... <span style="color:#cbd5e1">(${raw.length} 字 思维链)</span></div>
      </div>`;
    }else{
      const cursor=forceFinal?'':'<span class="cursor"></span>';
      contentEl.innerHTML=md2html(cleaned)+cursor;
      contentEl.dataset.raw=cleaned;
      // 自动滚到底
      contentEl.scrollTop=contentEl.scrollHeight;
    }
  }

  function updateMeta(){
    const elapsed=((new Date()-startedAt)/1000).toFixed(1);
    let modeLabel=meta.error?'❌ 失败':(meta.cached?'✅ 缓存':(meta.done?'✅ AI 分析':'⏳ 流式生成中'));
    const cacheTag=meta.cached?' · <span style="background:#dbeafe;color:#1e40af;padding:1px 6px;border-radius:4px;font-size:10px">⚡ 缓存命中</span>':'';
    metaEl.innerHTML=`${modeLabel} · 耗时 ${elapsed}s · 班级数: ${meta.classes_count||0}${cacheTag}`;
  }

  try{
    const res=await fetch(API+path,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Token':getToken()},
      body:body,
    });
    if(res.status===401){toLogin();return}
    if(!res.body){contentEl.innerHTML='<div style="color:#dc2626">浏览器不支持流式响应,请用 Chrome/Edge/Safari 新版</div>';return}
    const reader=res.body.getReader();
    const decoder=new TextDecoder();
    let buf='';
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data:'))continue;
        const ds=line.slice(5).trim();
        if(ds==='[DONE]')continue;
        let chunk;try{chunk=JSON.parse(ds)}catch{continue}
        if(chunk.meta){meta={...meta,...chunk.meta};updateMeta()}
        if(chunk.content){raw+=chunk.content;
          // 节流刷新避免每个 token 一次 reflow
          const now=Date.now();
          if(now-lastUpdate>120){updateDisplay();updateMeta();lastUpdate=now}
        }
        if(chunk.final){raw=chunk.final;meta.done=true;updateDisplay(true);updateMeta()}
        if(chunk.error){meta.error=chunk.error;contentEl.innerHTML='<div style="color:#dc2626;background:#fef2f2;padding:12px;border-radius:6px">❌ '+esc(chunk.error)+'</div>';updateMeta()}
      }
    }
    // 流结束兜底
    if(!meta.done&&!meta.error){updateDisplay(true);updateMeta()}
  }catch(e){
    contentEl.innerHTML='<div style="color:#dc2626">请求失败: '+esc(e.message)+'</div>';
  }
}

// ----- 💰 财务测算 (按月) -----
state.finStage='ALL';
state.finOverrides={};
function defaultFinMonth(){
  const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
state.finMonth=defaultFinMonth();
async function loadFinancial(){
  const params=new URLSearchParams();
  params.set('stage',state.finStage||'ALL');
  params.set('month',state.finMonth||defaultFinMonth());
  params.set('compare','1');
  Object.keys(state.finOverrides||{}).forEach(k=>{
    const v=state.finOverrides[k];
    if(v!==''&&v!==null&&v!==undefined)params.set('override_'+k,v);
  });
  try{
    const res=await api('/financial?'+params.toString());
    cache.financial=await res.json();
    renderFinancialTab();
  }catch(e){
    document.getElementById('admin-content').innerHTML='<div class="empty" style="color:#dc2626">加载失败: '+esc(e.message)+'</div>';
  }
}
function setFinStage(s){state.finStage=s;loadFinancial()}
function setFinMonth(m){state.finMonth=m;loadFinancial()}
function shiftFinMonth(delta){
  const [y,m]=state.finMonth.split('-').map(Number);
  let ny=y,nm=m+delta;
  while(nm>12){nm-=12;ny++}
  while(nm<1){nm+=12;ny--}
  state.finMonth=ny+'-'+String(nm).padStart(2,'0');
  loadFinancial();
}
function setFinOverride(field,val){
  if(val===''||val===null||val===undefined||val===0||val==='0')delete state.finOverrides[field];
  else state.finOverrides[field]=val;
  loadFinancial();
}
function fmtMonthLabel(m){
  if(!m)return '';
  const [y,mm]=m.split('-');
  return `${y} 年 ${parseInt(mm)} 月`;
}
function delta(cur,prev){
  if(prev==null||prev===0||cur==null)return null;
  return (cur-prev)/Math.abs(prev);
}
function renderDelta(d,colorInverse){
  if(d==null)return '';
  const pct=(d*100).toFixed(1)+'%';
  const isPos=d>=0;
  const color=colorInverse?(isPos?'#dc2626':'#059669'):(isPos?'#059669':'#dc2626');
  return ` <span style="font-size:11px;color:${color};font-weight:600">${isPos?'↑':'↓'} ${pct}</span>`;
}
const fY=v=>'¥'+(Math.round(v||0)).toLocaleString();
const fY2=v=>'¥'+((v||0)/10000).toFixed(1)+'万';
function renderFinancialTab(){
  const d=cache.financial||{};
  const agg=d.aggregate||{};
  const prev=(d.prev||{}).aggregate||null;
  const cfg=d.config||{};
  const byStage=d.by_stage||{};
  const overrides=d.overrides||{};

  // 顶部 KPI (with 环比)

  const dCost=prev?delta(agg.cost,prev.cost):null;
  const dProfit=prev?delta(agg.profit,prev.profit):null;
  const dPR=prev?(agg.profit_rate==null||prev.profit_rate==null?null:agg.profit_rate-prev.profit_rate):null;

  h+=`<div class="summary">

    <div class="kpi"><div class="kpi-label">本月成本</div><div class="kpi-value" style="color:#dc2626">${fY2(agg.cost)}</div><div class="kpi-sub">${fY(agg.cost)}${renderDelta(dCost,1)}</div></div>
    <div class="kpi"><div class="kpi-label">本月利润</div><div class="kpi-value" style="color:${(agg.profit||0)>=0?'#059669':'#dc2626'}">${fY2(agg.profit)}</div><div class="kpi-sub">${fY(agg.profit)}${renderDelta(dProfit)}</div></div>
    <div class="kpi"><div class="kpi-label">利润率</div><div class="kpi-value ${rateClass(agg.profit_rate,.3,.1)}">${fmtPct(agg.profit_rate)}</div><div class="kpi-sub">${dPR!=null?(dPR>=0?'↑':'↓')+' '+(Math.abs(dPR)*100).toFixed(1)+' pp':'基准 > 30%'}</div></div>
    <div class="kpi"><div class="kpi-label">HR 占比</div><div class="kpi-value ${rateClass(agg.hr_ratio==null?null:1-agg.hr_ratio,.8,.5)}">${fmtPct(agg.hr_ratio)}</div><div class="kpi-sub">${dHR!=null?(dHR>=0?'↑':'↓')+' '+(Math.abs(dHR)*100).toFixed(1)+' pp':'基准 < 20%'}</div></div>
  </div>`;

  // 月度提示:有几个开课月、几个收尾月
  const cls=d.by_class||[];
  const openCnt=cls.filter(c=>c.is_first_month).length;

  const midCnt=cls.length-openCnt-lastCnt;
  h+=`<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:#1e40af">
    <b>本月构成</b>: ${openCnt} 个 <span style="background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:4px">开课月</span>(贡献结算成本,无收入)
    · ${midCnt} 个 <span style="background:#dbeafe;color:#1e40af;padding:1px 6px;border-radius:4px">教学月</span>(仅 HR + 摊销)
    · ${lastCnt} 个 <span style="background:#dcfce7;color:#14532d;padding:1px 6px;border-radius:4px">收尾月</span>(实现收入)
    ${openCnt>lastCnt*2?'<br>⚠️ 开课月明显多于收尾月,本月利润可能偏低,这是正常分摊节奏':''}

  // 收入/成本明细
  h+=`<div style="background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px;border:1px solid #e5e7eb">
    <div style="font-weight:700;margin-bottom:12px;color:#374151;font-size:13px">📥 当月入款 / 💸 当月成本 拆解</div>

        <div style="font-size:12px;color:#6b7280;line-height:1.8">

          • 结算收入(从下阶段, N×receive): <b style="color:#1f2937">${fY(agg.revenue_settle)}</b>
        </div>
      </div>
      <div>
        <div style="color:#dc2626;font-weight:700;margin-bottom:8px">成本 ${fY(agg.cost)}</div>

          • 摊销(退费+其他/sp): <b style="color:#1f2937">${fY(agg.cost_amortized)}</b><br>
          • 结算成本(开课月一次性): <b style="color:#1f2937">${fY(agg.cost_settle)}</b><br>
          • 税费(收尾月, ${((cfg.tax_rate||0)*100+(cfg.hq_rate||0)*100).toFixed(1)}%): <b style="color:#1f2937">${fY(agg.cost_tax)}</b>
        </div>
      </div>
    </div>
  </div>`;

  // 阶段对比
  if(state.finStage==='ALL'&&Object.keys(byStage).length>1){
    h+=`<div class="section-title">阶段对比 (本月)</div>

    STAGES.forEach(s=>{
      const sa=byStage[s];if(!sa)return;
      h+=`<tr>
        <td><b>${s}</b></td>
        <td>${sa.classes_count}</td>
        <td>${fY(sa.revenue)}</td>
        <td style="color:#dc2626">${fY(sa.cost)}</td>
        <td style="color:${sa.profit>=0?'#059669':'#dc2626'};font-weight:700">${fY(sa.profit)}</td>
        <td class="rate ${rateClass(sa.profit_rate,.3,.1)}">${fmtPct(sa.profit_rate)}</td>
        <td class="rate ${rateClass(sa.hr_ratio==null?null:1-sa.hr_ratio,.8,.5)}">${fmtPct(sa.hr_ratio)}</td>
      </tr>`;
    });
    h+='</tbody></table></div>';
  }

  // 沙盘推演面板 (原 What-if)
  const overrideFields=[
    ['ta_salary','二讲月薪','元/月'],
    ['other_hr_cost','其他 HR 月成本','元/月'],
    ['next_tuition','下阶段学费','元'],
    ['service_period','服务周期','月'],

  h+=`<div class="section-title" style="margin-top:20px">🎲 沙盘推演 <span style="color:#9ca3af;font-weight:400;font-size:12px">假设性测算 - 改下面任意值,所有班按这个值重算本月 (只在屏幕上算,不动数据)</span></div>
    <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px 16px;margin-bottom:16px">
      <div class="form-grid">`;
  overrideFields.forEach(([k,l,u])=>{
    const cur=overrides[k]!==undefined?overrides[k]:'';

  });

  // 班级明细
  if(cls.length>0){

  document.getElementById('admin-content').innerHTML=h;
}

state.finTrendMetric='profit';
const FIN_TREND_METRICS=[
  ['revenue','入款','¥'],['cost','成本','¥'],['profit','利润','¥'],
  ['profit_rate','利润率','%'],['hr_ratio','HR 占比','%'],
];
async function openFinTrends(){
  const stage=state.finStage||'ALL';
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal lg" style="max-width:880px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h2>📈 财务月度趋势 · 最近 12 个月</h2>
          <button class="btn btn-sm" onclick="closeModal()">关闭</button>
        </div>
        <div class="modal-meta">数据范围: ${stage==='ALL'?'全部阶段':stage} · 基于当前班级数据按月份分摊计算</div>
        <div id="fin-trend-tabs" style="display:flex;gap:6px;margin:14px 0;flex-wrap:wrap"></div>
        <div id="fin-trend-chart" style="overflow-x:auto;background:#f9fafb;border-radius:8px;padding:14px"><div class="empty">加载中...</div></div>
        <div style="font-size:11px;color:#9ca3af;margin-top:12px">💡 鼠标悬停圆点看具体数值。空数据点说明该月无活跃班级。</div>
      </div>
    </div>`;
  try{
    const res=await api('/financial/trends?months=12&stage='+(stage));
    cache.finTrendData=await res.json();
    renderFinTrendTabs();renderFinTrendChart();
  }catch(e){
    document.getElementById('fin-trend-chart').innerHTML='<div class="empty" style="color:#dc2626">'+esc(e.message)+'</div>';
  }
}
function renderFinTrendTabs(){
  document.getElementById('fin-trend-tabs').innerHTML=FIN_TREND_METRICS.map(([k,l])=>
    `<button class="btn btn-sm ${state.finTrendMetric===k?'btn-primary':''}" onclick="setFinTrendMetric('${k}')">${l}</button>`
  ).join('');
}
function setFinTrendMetric(m){state.finTrendMetric=m;renderFinTrendTabs();renderFinTrendChart()}
function renderFinTrendChart(){
  const d=cache.finTrendData||{};
  const points=d.points||[];
  const metric=state.finTrendMetric;
  const isPct=metric==='profit_rate'||metric==='hr_ratio';
  if(points.length===0){document.getElementById('fin-trend-chart').innerHTML='<div class="empty">暂无数据</div>';return}
  const valid=points.filter(p=>p[metric]!=null);
  if(valid.length===0){document.getElementById('fin-trend-chart').innerHTML='<div class="empty">该指标无数据</div>';return}
  let max=Math.max(...valid.map(p=>p[metric]));
  let min=Math.min(0,...valid.map(p=>p[metric]));  // 利润可能为负
  if(isPct){max=Math.min(1,max*1.15);min=Math.min(0,min*1.15)}
  else{max=Math.ceil(max*1.15);min=Math.floor(min*1.05)}
  if(max===min)max=min+1;
  const W=820,H=340,ML=80,MR=20,MT=30,MB=50;
  const innerW=W-ML-MR,innerH=H-MT-MB;
  const xPos=i=>ML+(i/Math.max(1,points.length-1))*innerW;
  const yPos=v=>MT+innerH-((v-min)/(max-min))*innerH;
  let svg='';
  // y grid
  for(let i=0;i<=5;i++){
    const y=MT+innerH-(i/5)*innerH;
    const v=min+(max-min)*i/5;
    let lbl;
    if(isPct)lbl=(v*100).toFixed(0)+'%';
    else if(Math.abs(v)>=10000)lbl=(v/10000).toFixed(1)+'万';
    else lbl=Math.round(v).toLocaleString();
    svg+=`<line x1="${ML}" x2="${ML+innerW}" y1="${y}" y2="${y}" stroke="#e5e7eb"/>`;
    svg+=`<text x="${ML-8}" y="${y+4}" font-size="10" fill="#6b7280" text-anchor="end">${lbl}</text>`;
  }
  // 0 线 (如果在范围内)
  if(min<0&&max>0){
    const y=yPos(0);
    svg+=`<line x1="${ML}" x2="${ML+innerW}" y1="${y}" y2="${y}" stroke="#9ca3af" stroke-dasharray="3,3"/>`;
  }
  // x labels
  const step=Math.max(1,Math.floor(points.length/8));
  points.forEach((p,i)=>{
    if(i%step===0||i===points.length-1){
      svg+=`<text x="${xPos(i)}" y="${MT+innerH+18}" font-size="10" fill="#6b7280" text-anchor="middle">${p.month.slice(2)}</text>`;
    }
  });
  // line
  const color=metric==='profit'?'#059669':metric==='cost'?'#dc2626':metric==='revenue'?'#3b82f6':metric==='hr_ratio'?'#f59e0b':'#667eea';
  const linePts=points.map((p,i)=>p[metric]==null?null:[xPos(i),yPos(p[metric])]).filter(Boolean);
  if(linePts.length>0){
    const path=linePts.map((pt,i)=>`${i===0?'M':'L'} ${pt[0]} ${pt[1]}`).join(' ');
    // 填充区域
    const fillPath=path+` L ${linePts[linePts.length-1][0]} ${yPos(min<0&&max>0?0:min)} L ${linePts[0][0]} ${yPos(min<0&&max>0?0:min)} Z`;
    svg+=`<path d="${fillPath}" fill="${color}" fill-opacity="0.1"/>`;
    svg+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
  }
  // dots with tooltips
  points.forEach((p,i)=>{
    if(p[metric]==null)return;
    let v;
    if(isPct)v=(p[metric]*100).toFixed(1)+'%';
    else v='¥'+Math.round(p[metric]).toLocaleString();
    svg+=`<circle cx="${xPos(i)}" cy="${yPos(p[metric])}" r="4" fill="${color}" stroke="#fff" stroke-width="1.5"><title>${p.month}: ${v} (${p.classes_count} 班)</title></circle>`;
  });
  document.getElementById('fin-trend-chart').innerHTML=`<svg width="${W}" height="${H}" style="display:block;max-width:100%">${svg}</svg>`;
}

// ----- 班级明细 CSV 导出 (客户端) -----
function exportFinancialCsv(){
  const d=cache.financial;
  if(!d||!d.by_class||d.by_class.length===0){toast('当月没有数据可导出',1);return}
  const month=d.month||state.finMonth;
  const headers=['月份','阶段','开课日','价位','二讲','本月阶段','缴费(paid)','前4次(A)','续报(N)','本月入款','HR成本','摊销成本','结算成本','税费','本月成本','本月利润','利润率'];
  const escCsv=v=>{
    if(v==null)return '';
    const s=String(v);
    if(s.includes(',')||s.includes('"')||s.includes('\n'))return '"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  const rows=[headers.map(escCsv).join(',')];
  d.by_class.forEach(c=>{
    rows.push([
      month,c.stage,c.start_date,c.price||'',c.teacher||'',c.phase,
      c.paid,c.A,c.N,c.revenue,c.cost_hr,c.cost_amortized,c.cost_settle,c.cost_tax,c.cost,c.profit,
      c.revenue?(c.profit/c.revenue*100).toFixed(1)+'%':''
    ].map(escCsv).join(','));
  });
  const csv='﻿'+rows.join('\n');  // UTF-8 BOM for Excel
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`财务明细_${month}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
  toast(`已导出 ${d.by_class.length} 行`);
}

function renderJudgeLog(headerHtml){
  const d=cache.judgeLog||{};
  const log=d.log||[];
  const agg=d.agg||[];
  let h=headerHtml;
  h+=`<div class="section-row">
    <div class="section-title">🤖 AI 自评仪表盘 <span class="count">最近 ${d.days||30} 天</span></div>
    <span style="font-size:12px;color:#6b7280">每次主 AI 跑完会调一次 judge 给自己打分,低于 3.5 自动重生 1 次</span>
  </div>`;
  // 按功能聚合
  if(agg.length>0){
    h+=`<div class="tbl-wrap" style="margin-bottom:20px"><table>
      <thead><tr><th>功能</th><th>样本数</th><th>初评均分</th><th>最终均分</th><th>触发重生次数</th><th>提升</th></tr></thead>
      <tbody>`;
    agg.forEach(a=>{
      const init=parseFloat(a.avg_initial||0);
      const fin=parseFloat(a.avg_final||0);
      const lift=fin-init;
      h+=`<tr>
        <td><b>${esc(a.feature)}</b></td>
        <td>${a.n}</td>
        <td class="rate ${rateClass(init/5,.8,.6)}">${init.toFixed(2)}</td>
        <td class="rate ${rateClass(fin/5,.8,.6)}">${fin.toFixed(2)}</td>
        <td>${a.retries||0}</td>
        <td style="color:${lift>=0?'#059669':'#dc2626'};font-weight:600">${lift>=0?'+':''}${lift.toFixed(2)}</td>
      </tr>`;
    });
    h+='</tbody></table></div>';
  }
  // 详细日志
  h+=`<div class="section-title">最近评分明细</div>`;
  if(log.length===0){h+='<div class="empty">暂无 judge 日志,等下次 AI 跑会有</div>';document.getElementById('admin-content').innerHTML=h;return}
  h+=`<div class="tbl-wrap"><table>
    <thead><tr><th>时间</th><th>功能</th><th>用户</th><th>初评</th><th>最终</th><th>重生</th><th>问题(初评抓到的)</th></tr></thead>
    <tbody>`;
  log.forEach(r=>{
    const init=parseFloat(r.initial_score||0);
    const fin=parseFloat(r.final_score||0);
    const issues=Array.isArray(r.initial_issues)?r.initial_issues.join(' · '):'';
    h+=`<tr>
      <td style="font-size:11px;color:#6b7280">${fmtTime(r.created_at)}</td>
      <td>${esc(r.feature)}</td>
      <td>${esc(r.real_name)||'-'}</td>
      <td class="rate ${rateClass(init/5,.8,.6)}">${init.toFixed(1)}</td>
      <td class="rate ${rateClass(fin/5,.8,.6)}">${fin.toFixed(1)}</td>
      <td>${r.retry?'✓':'—'}</td>
      <td style="font-size:11px;max-width:300px;overflow:hidden;text-overflow:ellipsis" title="${esc(issues)}">${esc(issues)||'—'}</td>
    </tr>`;
  });
  h+='</tbody></table></div>';
  document.getElementById('admin-content').innerHTML=h;
}

// === 案例库视图 ===
function renderExamplesLib(headerHtml){
  const d=cache.examples||{};
  const examples=d.examples||[];
  const stats=d.stats||[];
  let h=headerHtml;
  h+=`<div class="section-row">
    <div class="section-title">📚 案例库 (Memory) <span class="count">${examples.length} 条</span></div>
    <span style="font-size:12px;color:#6b7280">用户打 4-5 星的输出自动收为「好例子」,1-2 星的为「反例」,下次同类问题作为 few-shot 注入 prompt</span>
  </div>`;
  // 统计
  if(stats.length>0){
    h+=`<div class="tbl-wrap" style="margin-bottom:20px"><table>
      <thead><tr><th>类型</th><th>角色</th><th>好例数</th><th>反例数</th></tr></thead>
      <tbody>`;
    const grouped={};
    stats.forEach(s=>{
      const k=`${s.example_type}|${s.role||''}`;
      if(!grouped[k])grouped[k]={example_type:s.example_type,role:s.role,good:0,bad:0};
      if(s.is_good)grouped[k].good=s.n;else grouped[k].bad=s.n;
    });
    Object.values(grouped).forEach(g=>{
      h+=`<tr>
        <td>${esc(g.example_type)}</td>
        <td>${esc(g.role)||'(任意)'}</td>
        <td style="color:#059669;font-weight:600">${g.good}</td>
        <td style="color:#dc2626;font-weight:600">${g.bad}</td>
      </tr>`;
    });
    h+='</tbody></table></div>';
  }
  // 案例
  if(examples.length===0){
    h+='<div class="empty">暂无案例 (用户给 4 星以上或 2 星以下后自动收录)</div>';
  }else{
    h+=`<div class="section-title">最近 200 条</div>`;
    examples.forEach(e=>{
      const isGood=e.is_good===1||e.is_good===true;
      const bgColor=isGood?'#f0fdf4':'#fef2f2';
      const borderColor=isGood?'#bbf7d0':'#fecaca';
      const tagColor=isGood?'#14532d':'#991b1b';
      const tagBg=isGood?'#dcfce7':'#fee2e2';
      const label=isGood?'✓ 好例':'✗ 反例';
      let preview='';
      try{
        const obj=JSON.parse(e.ai_output||'');
        preview=obj.title?(obj.title+(obj.action?' · '+obj.action:'')):JSON.stringify(obj).slice(0,200);
      }catch{preview=(e.ai_output||'').slice(0,200)}
      h+=`<div style="background:${bgColor};border:1px solid ${borderColor};border-radius:10px;padding:12px 16px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="display:flex;gap:8px;align-items:center">
            <span style="background:${tagBg};color:${tagColor};padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700">${label}</span>
            <span style="font-size:12px;color:#6b7280">${esc(e.example_type)} · ${esc(e.role)||''} · ⭐${e.rating} · ${esc(e.source_user_name)||'-'}</span>
          </div>
          <span style="font-size:10px;color:#9ca3af">${fmtTime(e.created_at)}</span>
        </div>
        <div style="font-size:13px;color:#374151;line-height:1.5">${esc(preview)}</div>
        ${e.context_summary?`<div style="font-size:11px;color:#9ca3af;margin-top:4px">用户备注: ${esc(e.context_summary)}</div>`:''}
      </div>`;
    });
  }
  document.getElementById('admin-content').innerHTML=h;
}

    return '<div class="empty" style="padding:20px;color:#9ca3af;font-size:13px">还没配备用 LLM。主挂了就只能等修复 — 建议至少加 1 个不同厂商的备用。</div>';

  return backups.map((b,i)=>`
    <div data-bk-idx="${i}" style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 16px;margin-bottom:10px">

          <button class="btn btn-sm" onclick="llmPromoteBackup(${i})" title="设为主 LLM (与主交换)">⭐ 设为主</button>

        </div>

      <div class="form-grid">
        <div class="f full">
          <label>厂商预设 <span class="help">选一个会自动填 Base URL + 模型示例,但不会动 API Key</span></label>
          <select class="bk-preset" onchange="llmApplyBackupPreset(${i},this.value)">
            <option value="">— 选预设 —</option>
            ${LLM_PRESETS.map((p,j)=>`<option value="${j}">${esc(p.label)}</option>`).join('')}
          </select>
        </div>
        <div class="f"><label>名字</label><input class="bk-name" value="${esc(b.name||'')}" placeholder="豆包后备"></div>
        <div class="f"><label>模型</label><input class="bk-model" value="${esc(b.model||'')}" placeholder="doubao-1-5-pro-32k-250115"></div>
        <div class="f full"><label>Base URL</label><input class="bk-url" value="${esc(b.base_url||'')}" placeholder="https://ark.cn-beijing.volces.com/api/v3"></div>
        <div class="f full"><label>API Key ${b.api_key_set?`<span style="color:#059669;font-size:11px">已设 ${esc(b.api_key_masked)}</span>`:'<span style="color:#dc2626;font-size:11px">未设置</span>'}</label><input type="text" class="bk-key" placeholder="${b.api_key_set?'留空 = 不修改':'sk-...'}" autocomplete="off"></div>
      </div>
      <div class="bk-test-result" style="margin-top:10px"></div>
    </div>
  `).join('');
}
function llmApplyBackupPreset(idx,presetIdx){
  const i=parseInt(presetIdx);
  if(isNaN(i))return;
  const p=LLM_PRESETS[i];
  const wrap=document.querySelector(`#llm-backups-list [data-bk-idx="${idx}"]`);
  if(!wrap)return;
  wrap.querySelector('.bk-url').value=p.base;
  if(p.models[0])wrap.querySelector('.bk-model').value=p.models[0];
  // 名字若还是默认"备用 N"则用厂商名替换,方便辨认
  const nameInput=wrap.querySelector('.bk-name');
  if(!nameInput.value.trim()||/^备用\s*\d+$/.test(nameInput.value.trim())){
    nameInput.value=p.label.replace(/\s*\(.*?\)/,'');
  }
}
function llmCollectBackups(){
  // 把当前 DOM 输入收集回 cache.llmConfig.backups (保留 api_key_set/api_key_masked 信息)
  const items=document.querySelectorAll('#llm-backups-list [data-bk-idx]');
  const fresh=[];
  items.forEach((el,i)=>{
    const orig=(cache.llmConfig.backups||[])[i]||{};
    fresh.push({
      name:el.querySelector('.bk-name').value.trim(),
      model:el.querySelector('.bk-model').value.trim(),
      base_url:el.querySelector('.bk-url').value.trim(),
      api_key:el.querySelector('.bk-key').value.trim(),
      api_key_set:orig.api_key_set,
      api_key_masked:orig.api_key_masked,
    });
  });
  cache.llmConfig.backups=fresh;
}
function llmAddBackup(){
  llmCollectBackups();
  if(!cache.llmConfig.backups)cache.llmConfig.backups=[];
  cache.llmConfig.backups.push({name:'备用 '+(cache.llmConfig.backups.length+1),model:'',base_url:'',api_key:'',api_key_set:false});
  renderLlmConfigTab();
}
function llmDeleteBackup(i){
  llmCollectBackups();
  if(!confirm('确认删除备用 '+(i+1)+'?\n(只是从列表移除,要点保存才生效)'))return;
  cache.llmConfig.backups.splice(i,1);
  renderLlmConfigTab();
}
// ---------- 主 / 备用 排序操作 (走 reorder API,直连 DB,不依赖前端编辑) ----------
async function llmReorder(order){
  try{
    const res=await api('/llm_config/reorder',{method:'POST',body:JSON.stringify({order})});
    const data=await res.json();
    if(!data.ok){toast(data.error||'排序失败',1);return}
    toast('已生效');
    await loadLlmConfig();
  }catch(e){toast(e.message,1)}
}
function llmPromoteBackup(i){
  // 备用 i 升为主 (与主交换)。order 中位置 0 是主,i+1 是备用 i
  const total=1+(cache.llmConfig.backups||[]).length;
  const order=Array.from({length:total},(_,k)=>k);
  [order[0],order[i+1]]=[order[i+1],order[0]];
  llmReorder(order);
}
function llmDemotePrimary(){
  // 主降为备用首位 = 把备用 0 提升为主
  if(!(cache.llmConfig.backups||[]).length){toast('没有备用可顶上,主无处可降',1);return}
  llmPromoteBackup(0);
}
function llmMoveBackup(i,delta){
  const total=1+(cache.llmConfig.backups||[]).length;
  const j=i+delta;
  if(j<0||j>=total-1)return;
  const order=Array.from({length:total},(_,k)=>k);
  [order[i+1],order[j+1]]=[order[j+1],order[i+1]];
  llmReorder(order);
}
function llmApplyPreset(){
  const i=parseInt(document.getElementById('llm-preset').value);
  if(isNaN(i))return;
  const p=LLM_PRESETS[i];
  document.getElementById('llm-base-url').value=p.base;
  if(p.models[0])document.getElementById('llm-model').value=p.models[0];
}
async function llmTestPrimary(){
  const result=document.getElementById('llm-test-result');
  result.innerHTML='<div style="color:#6b7280">测试主 LLM 中,请等 5-30 秒...</div>';
  const body={
    target:'primary',
    api_key:document.getElementById('llm-api-key').value.trim(),
    model:document.getElementById('llm-model').value.trim(),
    base_url:document.getElementById('llm-base-url').value.trim(),
  };
  await _llmRunTest(body,result);
}
async function llmTestBackup(i){
  llmCollectBackups();  // 先 sync 用户当前输入
  const wrap=document.querySelector(`#llm-backups-list [data-bk-idx="${i}"]`);
  const result=wrap.querySelector('.bk-test-result');
  result.innerHTML='<div style="color:#6b7280;font-size:12px">测试中...</div>';
  const b=cache.llmConfig.backups[i];
  const body={
    target:'backup',
    backup_idx:i,
    api_key:b.api_key||'',  // 空 = 后端用 DB 里的现有 key
    model:b.model||'',
    base_url:b.base_url||'',
  };
  await _llmRunTest(body,result);
}
async function _llmRunTest(body,resultEl){
  try{
    const res=await api('/llm_test',{method:'POST',body:JSON.stringify(body)});
    const data=await res.json();
    if(!data.ok){
      const elapsedTxt=(data.elapsed_seconds&&data.elapsed_seconds>0)?` (${data.elapsed_seconds}s)`:'';
      resultEl.innerHTML=`<div style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px;border-radius:6px;font-size:12px"><b>❌ 失败${elapsedTxt}</b><pre style="font-size:11px;margin-top:6px;white-space:pre-wrap;font-family:monospace">${esc(data.error||'')}</pre></div>`;
      return;
    }
    resultEl.innerHTML=`<div style="background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d;padding:10px;border-radius:6px;font-size:12px"><b>✅ 成功 (${data.elapsed_seconds}s)</b> · 模型 ${esc(data.model)}<br>回复: ${esc(data.reply)}</div>`;
  }catch(e){
    resultEl.innerHTML=`<div style="color:#dc2626;font-size:12px">${esc(e.message)}</div>`;
  }
}
async function llmSaveConfig(){
  const errEl=document.getElementById('llm-err');
  const showErr=m=>{errEl.textContent=m;errEl.style.display='block'};
  errEl.style.display='none';
  llmCollectBackups();
  // 校验:每个备用的 model + base_url 必须填,api_key 要么填要么是 api_key_set
  const invalid=[];
  cache.llmConfig.backups.forEach((b,i)=>{
    if(!b.model||!b.base_url){invalid.push(`备用 ${i+1}:模型/Base URL 必填`);return}
    if(!b.api_key&&!b.api_key_set){invalid.push(`备用 ${i+1}:API Key 必填`)}
  });
  if(invalid.length){showErr(invalid.join(' | '));return}
  const body={
    model:document.getElementById('llm-model').value.trim(),
    base_url:document.getElementById('llm-base-url').value.trim(),
    backups:cache.llmConfig.backups.map(b=>({
      name:b.name,model:b.model,base_url:b.base_url,api_key:b.api_key,
    })),
  };
  const newKey=document.getElementById('llm-api-key').value.trim();
  if(newKey)body.api_key=newKey;
  try{
    const res=await api('/llm_config',{method:'PATCH',body:JSON.stringify(body)});
    const data=await res.json();
    if(!res.ok){showErr(data.error||'保存失败');return}
    toast('已保存:主 + '+cache.llmConfig.backups.length+' 个备用,改完立即生效');
    await loadLlmConfig();
  }catch(e){showErr(e.message)}
}
async function llmClearCache(){
  if(!confirm('清掉 AI 响应缓存?(所有人下次点 AI 都会真调一次模型)'))return;
  try{
    const res=await api('/_clear_ai_cache',{method:'POST'});
    const data=await res.json();
    toast(`已清 ${data.cleared} 条缓存`);
    await loadLlmConfig();
  }catch(e){toast(e.message,1)}
}

function renderAdminStageTabs(currentCount,totalCount){

function setAdminStageTab(s){state.adminStageTab=s;renderAdminTab()}
function stagesIncludes(stagesCsv,target){
  // 二讲 stages 为空(NULL) = 跨阶段通用,在任何 stage tab 下都显示
  if(!stagesCsv)return true;
  return String(stagesCsv).split(',').map(x=>x.trim()).includes(target);
}

// ----- 二讲业绩榜 -----
function setTSSort(k){
  if(state.tsSortKey===k){
    if(state.tsSortDir==='asc'){state.tsSortDir='desc'}
    else if(state.tsSortDir==='desc'){state.tsSortKey='rate_retain';state.tsSortDir='desc'}  // 重置默认
  }else{state.tsSortKey=k;state.tsSortDir='desc'}  // 数字列默认降序
  renderAdminTab();
}
function tsSortArrow(k){
  if(state.tsSortKey!==k)return '<span style="opacity:.25;font-size:9px">⇅</span>';
  return state.tsSortDir==='asc'?'<span style="color:#667eea">▲</span>':'<span style="color:#667eea">▼</span>';
}
function renderTeacherStatsTab(){
  const allStats=(cache.teacherStats||[]).filter(t=>t.class_count>0);
  // 先按留存率算 TOP/BOT 5 (徽章用,不受用户排序影响 + 不受 stage 筛选影响)
  const withRetain=[...allStats].filter(t=>t.rate_retain!=null).sort((a,b)=>b.rate_retain-a.rate_retain);
  const top5=new Set(withRetain.slice(0,5).map(t=>t.id));
  const bot5=new Set(withRetain.slice(-5).map(t=>t.id));
  // 按 stage 筛选
  const filtered=state.adminStageTab==='ALL'
    ?allStats
    :allStats.filter(t=>stagesIncludes(t.stages,state.adminStageTab));
  // 按用户当前选的列排序
  const k=state.tsSortKey,d=state.tsSortDir==='desc'?-1:1;
  const stats=[...filtered].sort((a,b)=>{
    let va=a[k],vb=b[k];
    const aE=va==null||va==='',bE=vb==null||vb==='';
    if(aE&&bE)return 0;
    if(aE)return 1;
    if(bE)return -1;
    if(typeof va==='number'&&typeof vb==='number')return (va-vb)*d;
    return String(va).localeCompare(String(vb),'zh-CN')*d;
  });
  const noteEmpty='<span style="color:#9ca3af">—</span>';
  let h=`<div class="section-row">
    <div class="section-title">📊 二讲业绩榜单 <span class="count">${stats.length}${state.adminStageTab!=='ALL'?' / '+allStats.length:''} 个有班的二讲${state.adminStageTab!=='ALL'?' · '+state.adminStageTab:''}</span></div>
    <span style="font-size:12px;color:#6b7280">🏆 = 留存率 TOP 5;⚠️ = BOT 5;点列名排序</span>
  </div>`;
  h+=renderAdminStageTabs(stats.length,allStats.length);
  if(stats.length===0){h+=`<div class="empty">${state.adminStageTab==='ALL'?'暂无有班级的二讲':state.adminStageTab+' 阶段暂无有班的二讲'}</div>`;return h}
  const sortable=(key,label)=>`<th onclick="setTSSort('${key}')" style="cursor:pointer;user-select:none">${label} ${tsSortArrow(key)}</th>`;
  h+=`<div class="tbl-wrap"><table>
    <thead><tr>
      <th></th>
      ${sortable('name','二讲老师')}
      ${sortable('class_count','带几个班')}
      ${sortable('stages','覆盖阶段')}
      ${sortable('total_paid','缴费学员')}
      ${sortable('in_progress','在读')}
      ${sortable('total_refund','退费')}
      ${sortable('total_delay','延期')}
      ${sortable('rate_open','开课率')}
      ${sortable('rate_renew','续报率')}
      ${sortable('rate_retain','留存率')}
    </tr></thead><tbody>`;
  stats.forEach(t=>{
    let badge='',rowStyle='';
    if(top5.has(t.id)){badge='🏆';rowStyle='background:#f0fdf4'}
    else if(bot5.has(t.id)){badge='⚠️';rowStyle='background:#fef2f2'}
    h+=`<tr style="${rowStyle}">
      <td style="font-size:14px">${badge}</td>
      <td><b>${esc(t.name)}</b>${!t.active?' <span style="color:#9ca3af;font-size:10px">(已停用)</span>':''}</td>
      <td>${t.class_count}</td>
      <td>${esc(t.stages)||noteEmpty}</td>
      <td>${t.total_paid}</td>
      <td>${t.in_progress}</td>
      <td>${t.total_refund||0}</td>
      <td>${t.total_delay||0}</td>
      <td class="rate ${rateClass(t.rate_open,.7,.5)}">${fmtPct(t.rate_open)}</td>
      <td class="rate ${rateClass(t.rate_renew,.5,.3)}">${fmtPct(t.rate_renew)}</td>
      <td class="rate ${rateClass(t.rate_retain,.4,.2)}">${fmtPct(t.rate_retain)}</td>
    </tr>`;
  });
  h+='</tbody></table></div>';
  return h;
}

async function submitBatchNew(){
  const errEl=document.getElementById('bn-err');
  const showErr=m=>{errEl.textContent=m;errEl.style.display='block'};
  errEl.style.display='none';
  const mode=document.querySelector('input[name="bn-mode"]:checked').value;
  let trackId;
  if(mode==='existing'){
    const sel=document.getElementById('bn-track');
    if(!sel||!sel.value){showErr('请选一个轨次,或切到「新建轨次」');return}
    trackId=parseInt(sel.value);
  }else{
    const stage=document.getElementById('bn-stage').value;
    const start=document.getElementById('bn-start').value;
    const renewal=document.getElementById('bn-renewal').value||null;
    const end=document.getElementById('bn-end').value||null;
    if(!stage||!start){showErr('新建轨次需要至少阶段 + 开课日');return}
    try{
      const res=await api('/tracks',{method:'POST',body:JSON.stringify({stage,start_date:start,renewal_date:renewal,end_date:end})});
      const data=await res.json();
      if(!res.ok){showErr('建轨次失败: '+(data.error||'未知'));return}
      trackId=data.id;
    }catch(e){showErr('建轨次失败: '+e.message);return}
  }
  // 收集行
  const rows=[];
  document.querySelectorAll('.bn-row').forEach(tr=>{
    const price=parseInt(tr.querySelector('.bn-price').value)||0;
    const teacher_id=parseInt(tr.querySelector('.bn-teacher').value)||null;
    const owner_user_id=parseInt(tr.querySelector('.bn-owner').value)||null;
    const note=tr.querySelector('.bn-note').value.trim()||null;
    if(!price&&!teacher_id&&!owner_user_id&&!note)return;
    rows.push({track_id:trackId,price_per_student:price,teacher_id,owner_user_id,note});
  });
  if(rows.length===0){showErr('至少加一个班级(填了任何字段都算,空行会被跳过)');return}
  const submit=document.getElementById('bn-submit');
  submit.disabled=true;
  let created=0,errors=[];
  for(let i=0;i<rows.length;i++){
    submit.textContent=`创建中 ${i+1}/${rows.length}...`;
    try{
      const res=await api('/classes',{method:'POST',body:JSON.stringify(rows[i])});
      const data=await res.json();
      if(!res.ok)errors.push(`第 ${i+1} 行: ${data.error||'失败'}`);
      else created++;
    }catch(e){errors.push(`第 ${i+1} 行: ${e.message}`)}
  }
  if(errors.length===0){
    toast(`✅ 成功创建 ${created} 个班级`);
    closeModal();
  }else{
    showErr(`✅ 成功 ${created} 个\n❌ 失败 ${errors.length} 个:\n`+errors.join('\n'));
    submit.disabled=false;
    bnUpdateCount();
  }
  await loadAdminData();await loadOpsData();
  renderAdminTab();
}

// 通用 CSV 解析:支持引号包裹的字段(可含逗号),CSV 和 TSV
function parseCsvLine(line,sep){
  const cells=[];let cur='';let inQ=false;let i=0;
  while(i<line.length){
    const c=line[i];
    if(inQ){
      if(c==='"'){
        if(line[i+1]==='"'){cur+='"';i+=2}
        else{inQ=false;i++}
      }else{cur+=c;i++}
    }else{
      if(c==='"'&&cur===''){inQ=true;i++}
      else if(c===sep){cells.push(cur);cur='';i++}
      else{cur+=c;i++}
    }
  }
  cells.push(cur);
  return cells.map(s=>s.trim());
}
function parseCsv(text,columnMap){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return [];
  const sep=lines[0].includes('\t')?'\t':',';
  const headers=parseCsvLine(lines[0],sep);
  const map=columnMap||{};
  return lines.slice(1).map(line=>{
    const cells=parseCsvLine(line,sep);
    const row={};
    headers.forEach((h,i)=>{const k=map[h]||h;row[k]=(cells[i]||'').trim()});
    return row;
  });
}
function csvCell(v){
  // 输出 CSV 时:含逗号/引号/换行的值要包裹引号 + 内部引号 doubling
  if(v==null)return '';
  const s=String(v);
  if(s.includes(',')||s.includes('"')||s.includes('\n'))return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
async function submitCsvImport(){
  const errEl=document.getElementById('ci-err');
  const showErr=m=>{errEl.textContent=m;errEl.style.display='block'};
  errEl.style.display='none';
  const fileInput=document.getElementById('ci-file');
  const paste=document.getElementById('ci-paste').value.trim();
  let text=paste;
  if(!text&&fileInput.files.length){
    text=await fileInput.files[0].text();
  }
  if(!text){showErr('请上传文件或粘贴 CSV 文本');return}
  const CLASS_MAP={'阶段':'stage','开课日':'start_date','续报日':'renewal_date','结课日':'end_date','价位':'price','二讲老师':'teacher_name','负责人用户名':'owner_username','备注':'note'};
  const rows=parseCsv(text,CLASS_MAP);
  if(rows.length===0){showErr('解析不出任何数据行,检查 CSV 格式');return}
  if(!confirm(`即将导入 ${rows.length} 行,确定吗?`))return;
  document.getElementById('ci-result').innerHTML='<div style="color:#6b7280">导入中...</div>';
  try{
    const res=await api('/classes/bulk_import',{method:'POST',body:JSON.stringify({rows})});
    const data=await res.json();
    if(!res.ok){showErr(data.error||'导入失败');document.getElementById('ci-result').innerHTML='';return}
    let h=`<div style="background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d;padding:10px;border-radius:6px"><b>✅ 成功创建 ${data.created} 个班级</b></div>`;
    if(data.errors&&data.errors.length){
      h+=`<div style="margin-top:8px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px;border-radius:6px"><b>⚠️ ${data.errors.length} 行有错误</b><ul style="margin:6px 0 0 18px;font-size:12px">`;
      data.errors.slice(0,20).forEach(e=>h+=`<li>第 ${e.row} 行: ${esc(e.error)}</li>`);
      if(data.errors.length>20)h+=`<li>...还有 ${data.errors.length-20} 个</li>`;
      h+='</ul></div>';
    }
    document.getElementById('ci-result').innerHTML=h;
    await loadAdminData();await loadOpsData();
    // 不自动关闭,让用户看到结果
    setTimeout(()=>renderAdminTab(),100);

async function submitTeacherCsvImport(){
  const errEl=document.getElementById('ci-err');

  errEl.style.display='none';
  const fileInput=document.getElementById('ci-file');
  const paste=document.getElementById('ci-paste').value.trim();
  let text=paste;
  if(!text&&fileInput.files.length)text=await fileInput.files[0].text();
  if(!text){showErr('请上传文件或粘贴 CSV 文本');return}
  const MAP={'姓名':'name','负责阶段':'stages','电话':'phone','备注':'note'};
  const rows=parseCsv(text,MAP);
  if(rows.length===0){showErr('解析不出任何数据行');return}
  if(!confirm(`即将导入 ${rows.length} 行二讲,确定吗?`))return;
  document.getElementById('ci-result').innerHTML='<div style="color:#6b7280">导入中...</div>';
  try{
    const res=await api('/teachers/bulk_import',{method:'POST',body:JSON.stringify({rows})});
    const data=await res.json();
    if(!res.ok){showErr(data.error||'导入失败');document.getElementById('ci-result').innerHTML='';return}
    let h=`<div style="background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d;padding:10px;border-radius:6px"><b>✅ 新建 ${data.created} 个二讲${data.skipped?',跳过 '+data.skipped+' 个(同名已存在)':''}</b></div>`;
    if(data.errors&&data.errors.length){
      h+=`<div style="margin-top:8px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px;border-radius:6px"><b>⚠️ ${data.errors.length} 行失败</b><ul style="margin:6px 0 0 18px;font-size:12px">`;
      data.errors.slice(0,20).forEach(e=>h+=`<li>第 ${e.row} 行: ${esc(e.error)}</li>`);
      if(data.errors.length>20)h+=`<li>...还有 ${data.errors.length-20} 个</li>`;
      h+='</ul></div>';
    }
    document.getElementById('ci-result').innerHTML=h;
    await loadAdminData();await loadOpsData();
    setTimeout(()=>renderAdminTab(),100);
  }catch(e){showErr(e.message);document.getElementById('ci-result').innerHTML=''}
}

async function postWithErr(path,opts,onOk){
  try{
    const res=await api(path,opts);
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'操作失败');
    await onOk(data);
  }catch(e){
    const errEl=document.querySelector('.modal-error');
    if(errEl){errEl.textContent=e.message;errEl.style.display='block'}
    else toast(e.message,1);
  }
}
