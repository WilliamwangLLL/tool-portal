<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
  <title>磊哥总控台</title>
  <style>
    :root{color-scheme:dark;--bg:#071018;--panel:#101d28;--line:#2a3d4c;--text:#f3f6f8;--muted:#9db0bd;--gold:#f3c969;--green:#41d79c;--orange:#ffb563;--blue:#7eb7ff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0,#183148 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{border-bottom:1px solid var(--line);background:#071018e8}.bar{max-width:1220px;margin:auto;padding:22px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{color:var(--gold);text-decoration:none;border:1px solid #6f5c2b;border-radius:10px;padding:8px 11px}main{max-width:1220px;margin:auto;padding:28px 24px 70px}.intro{color:var(--muted);margin:0 0 22px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick-card{text-decoration:none;color:var(--text);min-height:132px;padding:18px;border:1px solid #405869;border-radius:17px;background:linear-gradient(145deg,#112333,#172d3d);display:flex;flex-direction:column;justify-content:space-between;transition:.18s transform,.18s border-color}.quick-card[hidden]{display:none}.quick-card:hover{transform:translateY(-2px);border-color:var(--gold)}.quick-card .icon{font-size:27px}.quick-card b{font-size:17px}.quick-card span{color:var(--muted);font-size:12px}.quick-card.admin{background:linear-gradient(145deg,#2b2614,#3b3014);border-color:#74602c}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 34px}.metric{border:1px solid var(--line);background:#0b1822;border-radius:13px;padding:12px}.metric b{display:block;color:var(--gold);font-size:22px}.metric span{color:var(--muted);font-size:12px}.group{margin:34px 0;scroll-margin-top:18px}.group-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 0 13px}.group h2{font-size:20px;margin:0}.group-head span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:15px;padding:16px;background:linear-gradient(145deg,var(--panel),#142532);display:grid;gap:12px}.card h3{font-size:16px;margin:0}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.badge{display:inline-block;border:1px solid #596f7e;border-radius:99px;padding:2px 7px;margin:3px 5px 0 0;font-size:11px}.badge.ready{border-color:#287256;color:#8ff0c8}.badge.pending{border-color:#8b6330;color:#ffd29a}.badge.stop{border-color:#7b4550;color:#ffb0ba}.open{display:inline-block;text-decoration:none;color:#071018;background:var(--gold);font-weight:750;border-radius:9px;padding:8px 11px;text-align:center}.open.disabled{pointer-events:none;background:#53616b;color:#c5cdd2}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.board{border:1px solid var(--line);border-radius:16px;padding:16px;background:#0b1923}.board h3{margin:0}.board-top{display:flex;justify-content:space-between;gap:8px;align-items:start}.board-page{font-size:11px;color:var(--blue);border:1px solid #31597c;border-radius:99px;padding:2px 7px;white-space:nowrap}.project-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.project-links a{color:#cfe3ef;text-decoration:none;border:1px solid #344d5c;border-radius:8px;padding:5px 8px;font-size:12px}.status-ok{padding:17px;border:1px solid #245a47;background:#0d2921;color:#a6e9cc;border-radius:14px}.empty{color:var(--muted);padding:30px;text-align:center}@media(max-width:900px){.quick{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(3,1fr)}.boards{grid-template-columns:1fr}}@media(max-width:620px){.bar{align-items:flex-start;flex-direction:column}.quick{grid-template-columns:1fr 1fr}.quick-card{min-height:116px;padding:14px}.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}main{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>
<header><div class="bar"><div><h1>磊哥总控台</h1><div class="sub">只记这一个入口，所有页面、项目和管理功能都从这里进入</div></div><nav class="links"><a href="/my/">公开工具箱</a><a href="/toolbox-control/admin/">管理后台</a></nav></div></header>
<main>
  <p class="intro">这里使用管理员总密码，包含公开、个人和定向分享的完整视图。伙伴只拿对应项目的独立链接和独立密码。</p>
  <section class="quick">
    <a class="quick-card" href="/my/"><span class="icon">🌐</span><b>公开工具箱</b><span>查看所有对外公开的内容</span></a>
    <a class="quick-card" id="business-quick" href="/my/business/"><span class="icon">📊</span><b>公开商业工具</b><span>进入公开的商业工具页面</span></a>
    <a class="quick-card" href="#owner-tools"><span class="icon">🔐</span><b>我的私人工具</b><span>只使用管理员总密码进入</span></a>
    <a class="quick-card admin" href="/toolbox-control/admin/"><span class="icon">⚙️</span><b>管理后台</b><span>管理板块、项目权限与密码</span></a>
  </section>
  <section class="summary" id="summary"></section>
  <div id="content"></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const audienceLabels={public:'公开',owner:'仅自己',shared:'分享'};
const pageLabels={home:'工具箱首页',business:'商业工具页'};
const published=x=>x?.policy?.audience==='public'&&x.policy.listed&&x.policy.status==='online';
function hasPublicPage(p,page){const section=p.sections.find(x=>x.page===page);return published(section)&&p.boards.some(b=>b.page===page&&published(b)&&b.members.some(m=>m.kind==='items'&&published(p.items.find(x=>x.id===m.id))))}
function card(x){const p=x.policy,stopped=p.status!=='online';let badges='<span class="badge">'+audienceLabels[p.audience]+'</span>';if(stopped)badges+='<span class="badge stop">'+(p.status==='maintenance'?'维护中':'已停用')+'</span>';if(p.audience==='shared')badges+='<span class="badge '+(x.credential.scope==='independent'?'ready':'pending')+'">'+(x.credential.scope==='independent'?'独立密码已设置':'待设置分享密码')+'</span>';return '<article class="card"><div><h3>'+esc(x.title)+'</h3><div class="meta">'+esc(x.board?.title||'未分组')+' · '+esc(x.target)+'</div></div><div>'+badges+'</div><a class="open '+(stopped?'disabled':'')+'" href="'+esc(x.shareUrl)+'" target="_blank">'+(stopped?'暂不可用':'打开项目')+'</a></article>'}
function audienceSection(id,title,items){return '<section class="group" id="'+id+'"><div class="group-head"><h2>'+title+' · '+items.length+'</h2><span>'+('owner-tools'===id?'仅管理员可访问':'每个项目使用自己的独立密码')+'</span></div><div class="grid">'+(items.map(card).join('')||'<div class="empty">暂无项目</div>')+'</div></section>'}
function boardSection(p){const byKey=new Map(p.items.map(x=>['items:'+x.id,x]));return '<section class="group" id="all-boards"><div class="group-head"><h2>全部板块 · '+p.boards.length+'</h2><span>板块归属和排序可在管理后台调整</span></div><div class="boards">'+p.boards.map(b=>{const items=b.members.map(m=>byKey.get(m.kind+':'+m.id)).filter(Boolean);return '<article class="board"><div class="board-top"><div><h3>'+esc(b.title)+'</h3><div class="meta">'+b.members.length+' 个项目 / 页面 · '+audienceLabels[b.policy.audience]+'</div></div><span class="board-page">'+pageLabels[b.page]+'</span></div><div class="project-links">'+items.map(x=>'<a href="'+esc(x.shareUrl)+'" target="_blank">'+esc(x.title)+'</a>').join('')+(items.length?'':'<span class="meta">包含页面入口</span>')+'</div></article>'}).join('')+'</div></section>'}
function statusSection(items){const abnormal=items.filter(x=>x.policy.status!=='online');return '<section class="group"><div class="group-head"><h2>运行状态</h2><span>维护或停用项目会在这里集中出现</span></div>'+(abnormal.length?'<div class="grid">'+abnormal.map(card).join('')+'</div>':'<div class="status-ok">当前全部项目正常运行，没有维护中或已停用项目。</div>')+'</section>'}
async function load(){const r=await fetch('../api/state',{cache:'no-store'});if(!r.ok)throw new Error('读取总控台失败');const p=await r.json();document.querySelector('#business-quick').hidden=!hasPublicPage(p,'business');const owner=p.items.filter(x=>x.policy.audience==='owner'),shared=p.items.filter(x=>x.policy.audience==='shared'),publicItems=p.items.filter(x=>x.policy.audience==='public'),pending=shared.filter(x=>x.credential.scope!=='independent').length;const metrics=[['板块',p.boards.length],['公开项目',publicItems.length],['私人工具',owner.length],['分享项目',shared.length],['待设密码',pending]];document.querySelector('#summary').innerHTML=metrics.map(([t,n])=>'<div class="metric"><b>'+n+'</b><span>'+t+'</span></div>').join('');document.querySelector('#content').innerHTML=audienceSection('owner-tools','我的私人工具',owner)+audienceSection('shared-tools','小范围分享',shared)+boardSection(p)+statusSection(p.items)}
load().catch(e=>document.querySelector('#content').innerHTML='<div class="empty">'+esc(e.message)+'</div>');
</script>
</body>
</html>
