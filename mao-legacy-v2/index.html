    const refs = {
      title: document.getElementById("pageTitle"),
      subtitle: document.getElementById("pageSubtitle"),
      note: document.getElementById("heroNote"),
      tocTitle: document.getElementById("tocTitle"),
      toc: document.getElementById("toc"),
      app: document.getElementById("app"),
      footer: document.getElementById("footer"),
      zhBtn: document.getElementById("zhBtn"),
      enBtn: document.getElementById("enBtn"),
      printBtn: document.getElementById("printBtn"),
      topBtn: document.getElementById("topBtn"),
      langBadge: document.getElementById("langBadge")
    };

    let currentLang = "zh";
    let tocObserver = null;

    function renderParagraphs(arr) {
      return arr.map(p => `<p>${p}</p>`).join("");
    }

    function renderChapter(chapter, d) {
      return `
        <section id="${chapter.id}" class="card">
          <div class="section-header">
            <div class="eyebrow">${d.labels.chapter}</div>
            <h2>${chapter.title}</h2>
          </div>
          ${renderParagraphs(chapter.paragraphs)}
          ${chapter.points && chapter.points.length
            ? `<ul>${chapter.points.map(item => `<li>${item}</li>`).join("")}</ul>`
            : ""
          }
        </section>
      `;
    }

    function renderCards(items, type) {
      return `
        <div class="duo-grid">
          ${items.map(item => `
            <article class="mini-card ${type}">
              <h3>${item.title}</h3>
              <p>${item.text}</p>
            </article>
          `).join("")}
        </div>
      `;
    }

    function renderMatrix(rows, d) {
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>${d.labels.domain}</th>
                <th>${d.labels.positive}</th>
                <th>${d.labels.negative}</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  <td><strong>${row.domain}</strong></td>
                  <td>${row.positive}</td>
                  <td>${row.negative}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderTimeline(items) {
      return `
        <div class="timeline">
          ${items.map(item => `
            <div class="timeline-item">
              <div class="year">${item.year}</div>
              <div>${item.text}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderReadings(items) {
      return `
        <ol>
          ${items.map(item => `
            <li>
              <strong>${item.name}</strong><br />
              <span class="muted">${item.note}</span>
            </li>
          `).join("")}
        </ol>
      `;
    }

    function buildTOC(d) {
      const items = [
        { id: "overview", title: d.labels.overview },
        ...d.chapters.map(c => ({ id: c.id, title: c.title })),
        { id: "merits", title: d.labels.merits },
        { id: "faults", title: d.labels.faults },
        { id: "matrix", title: d.labels.matrix },
        { id: "debates", title: d.labels.debates },
        { id: "timeline", title: d.labels.timeline },
        { id: "readings", title: d.labels.readings },
        { id: "conclusion", title: d.labels.conclusion }
      ];

      refs.toc.innerHTML = items.map(item => `
        <a href="#${item.id}">${item.title}</a>
      `).join("");
    }

    function renderPage(lang) {
      currentLang = lang;
      const d = content[lang];

      document.documentElement.lang = d.htmlLang;
      document.title = d.browserTitle;

      refs.title.textContent = d.title;
      refs.subtitle.textContent = d.subtitle;
      refs.note.innerHTML = `<strong>${d.labels.noteTitle}：</strong>${d.note}`;

      refs.printBtn.textContent = d.labels.print;
      refs.topBtn.textContent = d.labels.top;
      refs.langBadge.textContent = d.labels.languageBadge;
      refs.footer.textContent = d.footer;

      refs.app.innerHTML = `
        <section id="overview" class="card">
          <div class="section-header">
            <div class="eyebrow">${d.labels.overview}</div>

            : "If you want a genuinely deep understanding of Mao, it is best to read across original texts, official resolutions, overseas scholarship, social history, and demographic studies rather than relying on a single viewpoint."
          }</p>
          ${renderReadings(d.readings)}
        </section>

        <section id="conclusion" class="card">
          <div class="section-header">

            <h2>${d.conclusion.title}</h2>
          </div>
          ${renderParagraphs(d.conclusion.paragraphs)}
        </section>
      `;

      updateLangButtons(lang);
      setupObserver();
    }

    function updateLangButtons(lang) {
      const isZh = lang === "zh";
      refs.zhBtn.classList.toggle("active", isZh);
      refs.enBtn.classList.toggle("active", !isZh);
      refs.zhBtn.setAttribute("aria-pressed", String(isZh));
      refs.enBtn.setAttribute("aria-pressed", String(!isZh));
    }

    function setupObserver() {
      if (tocObserver) tocObserver.disconnect();

      const links = Array.from(document.querySelectorAll(".toc a"));
      const sections = Array.from(document.querySelectorAll("main section[id]"));

      tocObserver = new IntersectionObserver(
        entries => {
          const visible = entries
            .filter(entry => entry.isIntersecting)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];

          if (!visible) return;
          const id = visible.target.id;

          links.forEach(link => {
            link.classList.toggle("active", link.getAttribute("href") === `#${id}`);
          });
        },
        {
          rootMargin: "-20% 0px -65% 0px",
          threshold: 0.01
        }
      );

      sections.forEach(section => tocObserver.observe(section));
    }

    refs.zhBtn.addEventListener("click", () => renderPage("zh"));
    refs.enBtn.addEventListener("click", () => renderPage("en"));
    refs.printBtn.addEventListener("click", () => window.print());

    refs.topBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    window.addEventListener("scroll", () => {
      if (window.scrollY > 320) {
        refs.topBtn.classList.add("show");
      } else {
        refs.topBtn.classList.remove("show");
      }
    });

    renderPage("zh");
