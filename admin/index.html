<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>磊哥的工具箱 · 管理后台</title>
  <style>
    :root{color-scheme:dark;--bg:#071018;--panel:#101d28;--panel2:#162633;--line:#2a3d4c;--text:#f3f6f8;--muted:#9db0bd;--gold:#f3c969;--green:#41d79c;--red:#ff7585;--blue:#7eb7ff;--orange:#ffb563}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#183148 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}
    header{position:sticky;top:0;z-index:5;background:rgba(7,16,24,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.bar{max-width:1320px;margin:auto;padding:17px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between}.brand h1{font-size:21px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{color:var(--gold);text-decoration:none;border:1px solid #6f5c2b;border-radius:10px;padding:8px 11px}.links a[hidden]{display:none}
    main{max-width:1320px;margin:auto;padding:25px 24px 64px}.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.metric{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:15px;padding:15px}.metric b{display:block;font-size:25px;color:var(--gold)}.metric span{color:var(--muted)}
    .guide{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.guide div{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:#0c1822}.guide b{display:block}.guide span{font-size:12px;color:var(--muted)}.sync{font-size:13px;margin:14px 0}.sync.ok{color:var(--green)}.sync.error{color:var(--red)}
    .board-panel{margin:28px 0 34px;padding:20px;border:1px solid #365065;border-radius:18px;background:linear-gradient(145deg,#0c1924,#112431)}.section-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:15px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.primary,.small-button{border:1px solid #6aa6d2;background:#27465c;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.board-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.board-card{border:1px solid var(--line);border-radius:15px;padding:15px;background:#0a1720;display:grid;gap:12px}.board-top{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:8px;align-items:end}.board-count{color:var(--gold);font-size:12px;white-space:nowrap;padding:9px 2px}.board-actions{display:flex;gap:7px;flex-wrap:wrap}.board-actions button{border:1px solid var(--line);background:#101f2a;color:var(--text);border-radius:8px;padding:7px 9px;cursor:pointer}.members{display:flex;gap:6px;flex-wrap:wrap}.member{font-size:11px;color:#b8c8d2;border:1px solid #38505f;border-radius:99px;padding:2px 7px}.board-policy{border-top:1px solid #203746;padding-top:11px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}.tabs button{border:1px solid var(--line);background:#0c1720;color:var(--text);border-radius:99px;padding:9px 14px;cursor:pointer}.tabs button.active{background:#284a61;border-color:#70b5e6}.toolbar{display:flex;gap:12px;align-items:center;margin:15px 0}.toolbar h2{margin:0;font-size:19px}.toolbar input{margin-left:auto;width:min(370px,52vw);background:#0b1620;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px}
    .grid{display:grid;gap:10px}.row{display:grid;grid-template-columns:minmax(220px,1.25fr) minmax(180px,.75fr) minmax(390px,1.5fr) auto;gap:14px;align-items:center;background:rgba(16,29,40,.94);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.row[hidden]{display:none}.title{font-weight:760}.meta{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-block;border:1px solid #77552b;color:#ffcf87;border-radius:99px;padding:1px 7px;margin-left:7px;font-size:11px}.policy{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.field{display:grid;gap:4px}.field label{font-size:11px;color:var(--muted)}select,input{background:#09151e;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px;min-width:0}.listed{display:flex;align-items:center;gap:6px;padding:8px 2px;white-space:nowrap;font-size:13px;color:var(--muted)}.credential{display:grid;gap:6px;justify-items:end}.credential button{border:1px solid #806a32;background:#17180f;color:#ffe09a;border-radius:9px;padding:8px 10px;cursor:pointer}.credential small{color:var(--muted)}.credential .ready{color:var(--green)}.credential .pending{color:var(--orange)}
    details.advanced{margin-top:28px;border-top:1px solid var(--line);padding-top:15px}details.advanced summary{cursor:pointer;color:var(--muted);font-weight:700;margin-bottom:12px}.empty{text-align:center;color:var(--muted);padding:30px}.toast{position:fixed;right:20px;bottom:20px;z-index:20;background:#17382d;border:1px solid #3d8b6d;color:#c3f7e2;border-radius:11px;padding:10px 14px;box-shadow:0 10px 36px #0009}
    dialog{width:min(580px,calc(100vw - 30px));border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0;box-shadow:0 24px 80px #000b}dialog::backdrop{background:#02070cbb;backdrop-filter:blur(4px)}.dialog-body{padding:24px}.dialog-body h2{margin:0 0 6px}.dialog-body>p{margin:0 0 17px;color:var(--muted)}.dialog-body .field{margin:12px 0}.dialog-body input,.dialog-body select{width:100%;padding:11px 12px}.inline{display:flex;gap:8px}.inline input{flex:1}.inline button,.dialog-actions button{border:1px solid var(--line);background:#0c1720;color:var(--text);border-radius:9px;padding:9px 11px;cursor:pointer}.dialog-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.dialog-actions .primary{background:#27465c;border-color:#6aa6d2}.result{display:none;margin-top:14px;padding:12px;border-radius:11px;background:#102b24;border:1px solid #28634f;color:#a9f0d2}.result.show{display:block}
    @media(max-width:1080px){.summary{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:1fr 1fr}.credential{justify-items:start}.board-grid{grid-template-columns:1fr}}
    @media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.guide{grid-template-columns:1fr}.row{grid-template-columns:1fr}.policy{grid-template-columns:1fr 1fr}.listed{grid-column:1/-1}.bar,.section-head{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%;margin:0}.board-top{grid-template-columns:1fr}.board-count{padding:0}}
  </style>
</head>
<body>
<header><div class="bar"><div class="brand"><h1>磊哥的工具箱 · 管理后台</h1><p>板块负责归类和目录呈现，项目负责自己的访问权限和独立密码</p></div><nav class="links"><a href="/my/">公开工具箱</a><a id="business-public-link" href="/my/business/">商业工具</a><a href="/toolbox-control/workspace/">磊哥总控台</a></nav></div></header>
<main>
  <section class="summary" id="summary"></section>
  <section class="guide"><div><b>公开</b><span>任何人都能访问，可选择是否出现在公开目录。</span></div><div><b>仅自己</b><span>使用管理员总密码，适合内部后台和个人驾驶舱。</span></div><div><b>小范围分享</b><span>每个项目单独密码；项目 A 的密码不能访问项目 B。</span></div></section>
  <div id="sync"></div>
  <section class="board-panel">
    <div class="section-head"><div><h2>板块管理</h2><p>新建板块时必须放入首个项目；项目移走后若原板块变空，系统会自动删除原板块。</p></div><button class="primary" id="create-board" type="button">＋ 创建新板块</button></div>
    <div class="board-grid" id="boards"></div>
  </section>
  <nav class="tabs" id="tabs"></nav>
  <div class="toolbar"><h2 id="list-title">项目与页面</h2><input id="search" placeholder="搜索名称、板块或地址"></div>
  <section class="grid" id="items"></section>
  <details class="advanced"><summary>高级：总页面访问策略</summary><section class="grid" id="sections"></section></details>
</main>

<dialog id="board-dialog"><div class="dialog-body"><h2>创建新板块</h2><p>为了不产生空板块，请同时选择这个板块里的第一个项目或页面。</p><div class="field"><label>板块名称</label><input id="board-title" maxlength="48" placeholder="例如：AI 实用工具"></div><div class="field"><label>显示在哪个页面</label><select id="board-page"><option value="home">公开工具箱首页</option><option value="business">商业工具页</option></select></div><div class="field"><label>首个项目 / 页面</label><select id="board-first-member"></select></div><div class="dialog-actions"><button class="primary" id="save-board" type="button">创建板块并移动项目</button><button id="close-board" type="button">取消</button></div></div></dialog>

<dialog id="credential-dialog"><div class="dialog-body"><h2 id="credential-title">设置项目分享密码</h2><p>这个账号只用于当前项目。服务器只保存加盐哈希，关闭后无法找回明文。</p><div class="field"><label>分享用户名</label><input id="credential-username" value="guest" maxlength="32" autocomplete="off"></div><div class="field"><label>新密码（至少 10 位）</label><div class="inline"><input id="credential-password" type="password" maxlength="128" autocomplete="new-password"><button id="generate-password" type="button">随机生成</button></div></div><div class="field"><label>再次输入密码</label><input id="credential-confirm" type="password" maxlength="128" autocomplete="new-password"></div><label class="listed"><input id="show-password" type="checkbox">显示密码</label><div id="credential-result" class="result"></div><div class="dialog-actions"><button class="primary" id="save-credential" type="button">保存项目密码</button><button id="copy-credential" type="button" hidden>复制账号、密码和链接</button><button id="close-credential" type="button">关闭</button></div></div></dialog>

<script>
const audienceLabels={public:'公开',owner:'仅自己',shared:'小范围分享'};
const statusLabels={online:'正常运行',maintenance:'维护中',offline:'已停用'};
const pageLabels={home:'工具箱首页',business:'商业工具页'};
let payload=null,activeTab='public',editing=null,lastSecret='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const adminHeaders={'Content-Type':'application/json','X-Toolbox-Admin':'1'};
const published=x=>x?.policy?.audience==='public'&&x.policy.listed&&x.policy.status==='online';
function hasPublicPage(page){const section=payload.sections.find(x=>x.page===page);return published(section)&&payload.boards.some(b=>b.page===page&&published(b)&&b.members.some(m=>m.kind==='items'&&published(payload.items.find(x=>x.id===m.id))))}
function metrics(){const all=payload.items;const values=[['板块',payload.boards.length],['公开工具',all.filter(x=>x.policy.audience==='public').length],['仅自己',all.filter(x=>x.policy.audience==='owner').length],['小范围分享',all.filter(x=>x.policy.audience==='shared').length],['维护 / 停用',all.filter(x=>x.policy.status!=='online').length]];document.querySelector('#summary').innerHTML=values.map(([t,n])=>'<div class="metric"><b>'+n+'</b><span>'+t+'</span></div>').join('')}
function tabs(){const defs=[['public','公开'],['owner','仅自己'],['shared','小范围分享'],['inactive','停用维护']];document.querySelector('#tabs').innerHTML=defs.map(([id,label])=>'<button data-tab="'+id+'" class="'+(id===activeTab?'active':'')+'">'+label+' · '+payload.items.filter(x=>id==='inactive'?x.policy.status!=='online':x.policy.audience===id).length+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()})}
function policyControls(x,kind){return '<div class="policy"><div class="field"><label>访问对象</label><select data-policy="audience" data-kind="'+kind+'" data-id="'+x.id+'">'+Object.entries(audienceLabels).map(([v,l])=>'<option value="'+v+'" '+(x.policy.audience===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="field"><label>运行状态</label><select data-policy="status" data-kind="'+kind+'" data-id="'+x.id+'">'+Object.entries(statusLabels).map(([v,l])=>'<option value="'+v+'" '+(x.policy.status===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div><label class="listed"><input type="checkbox" data-policy="listed" data-kind="'+kind+'" data-id="'+x.id+'" '+(x.policy.listed?'checked':'')+' '+(x.policy.audience!=='public'?'disabled':'')+'>公开目录展示</label></div>'}
function memberName(member){const collection=member.kind==='items'?payload.items:payload.sections;return collection.find(x=>x.id===member.id)?.title||member.id}
function boardCard(board,index){return '<article class="board-card"><div class="board-top"><div class="field"><label>板块名称</label><input data-board-title="'+board.id+'" maxlength="48" value="'+esc(board.title)+'"></div><div class="field"><label>显示页面</label><select data-board-page="'+board.id+'">'+Object.entries(pageLabels).map(([v,l])=>'<option value="'+v+'" '+(board.page===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="board-count">'+board.members.length+' 个项目</div></div><div class="members">'+board.members.map(m=>'<span class="member">'+esc(memberName(m))+'</span>').join('')+'</div><div class="board-actions"><button data-save-board="'+board.id+'">保存名称与页面</button><button data-board-up="'+board.id+'" '+(index===0?'disabled':'')+'>上移</button><button data-board-down="'+board.id+'" '+(index===payload.boards.length-1?'disabled':'')+'>下移</button></div><div class="board-policy">'+policyControls(board,'boards')+'</div></article>'}
function renderBoards(){document.querySelector('#boards').innerHTML=payload.boards.map(boardCard).join('')}
function boardSelect(x,kind){if(kind==='sections'&&!x.boardable)return '<div></div>';return '<div class="field"><label>所属板块</label><select data-board-member="'+kind+':'+x.id+'">'+payload.boards.map(b=>'<option value="'+b.id+'" '+(x.board?.id===b.id?'selected':'')+' '+(kind==='sections'&&x.page===b.page?'disabled':'')+'>'+esc(b.title)+' · '+pageLabels[b.page]+'</option>').join('')+'</select></div>'}
function credential(x,kind){if(kind!=='items'||x.policy.audience!=='shared')return '<div></div>';const ready=x.credential.scope==='independent';return '<div class="credential"><button data-credential="'+x.id+'">'+(ready?'更换项目密码':'设置项目密码')+'</button><small class="'+(ready?'ready':'pending')+'">'+(ready?'已配置 · '+esc(x.credential.username):'待设置，当前仅管理员可访问')+'</small>'+(ready?'<button data-copy-link="'+x.id+'">复制分享链接</button>':'')+'</div>'}
function row(x,kind){const marker=x.enforcement==='gateway-only'?'<span class="badge">仅保护入口</span>':'';const note=x.note||x.target||'';return '<article class="row" data-search="'+esc((x.title+' '+(x.group||'')+' '+(x.board?.title||'')+' '+note).toLowerCase())+'"><div><div class="title">'+esc(x.title)+marker+'</div><div class="meta">'+esc(x.group||x.kind)+' · '+esc(note)+'</div></div>'+boardSelect(x,kind)+policyControls(x,kind)+credential(x,kind)+'</article>'}
function visible(x){return activeTab==='inactive'?x.policy.status!=='online':x.policy.audience===activeTab}
function render(){document.querySelector('#business-public-link').hidden=!hasPublicPage('business');metrics();tabs();renderBoards();document.querySelector('#items').innerHTML=payload.items.filter(visible).map(x=>row(x,'items')).join('')||'<div class="empty">这个分类暂时没有项目</div>';document.querySelector('#sections').innerHTML=payload.sections.map(x=>row(x,'sections')).join('');const a=payload.applyStatus;document.querySelector('#sync').innerHTML=a?'<p class="sync '+(a.ok?'ok':'error')+'">访问规则同步：'+(a.ok?'已完成':'失败')+(a.message?' · '+esc(a.message):'')+'</p>':'<p class="sync">访问规则同步：等待首次应用</p>';bind();filter()}
function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2200)}
async function request(url,options){document.querySelectorAll('button,select,input').forEach(x=>x.disabled=true);try{const r=await fetch(url,options);const j=await r.json();if(!r.ok)throw new Error(j.error||'操作失败');payload=j;render();setTimeout(load,900);return j}catch(e){alert(e.message);await load();throw e}}
async function patchPolicy(el){const value=el.dataset.policy==='listed'?el.checked:el.value;await request('../api/policy/'+el.dataset.kind+'/'+el.dataset.id,{method:'PATCH',headers:adminHeaders,body:JSON.stringify({[el.dataset.policy]:value})}).catch(()=>{})}
async function moveMember(el){const [kind,id]=el.dataset.boardMember.split(':');await request('../api/boards/'+el.value+'/members',{method:'POST',headers:adminHeaders,body:JSON.stringify({kind,id})}).then(()=>toast('项目已移动；空板块已自动清理')).catch(()=>{})}
async function saveBoardMeta(id){const title=document.querySelector('[data-board-title="'+id+'"]').value;const page=document.querySelector('[data-board-page="'+id+'"]').value;await request('../api/boards/'+id,{method:'PATCH',headers:adminHeaders,body:JSON.stringify({title,page})}).then(()=>toast('板块已保存')).catch(()=>{})}
async function reorderBoard(id,delta){const index=payload.boards.findIndex(b=>b.id===id);await request('../api/boards/'+id,{method:'PATCH',headers:adminHeaders,body:JSON.stringify({position:index+delta})}).catch(()=>{})}
function bind(){document.querySelectorAll('[data-policy]').forEach(el=>el.onchange=()=>patchPolicy(el));document.querySelectorAll('[data-board-member]').forEach(el=>el.onchange=()=>moveMember(el));document.querySelectorAll('[data-save-board]').forEach(b=>b.onclick=()=>saveBoardMeta(b.dataset.saveBoard));document.querySelectorAll('[data-board-up]').forEach(b=>b.onclick=()=>reorderBoard(b.dataset.boardUp,-1));document.querySelectorAll('[data-board-down]').forEach(b=>b.onclick=()=>reorderBoard(b.dataset.boardDown,1));document.querySelectorAll('[data-credential]').forEach(b=>b.onclick=()=>openCredential(b.dataset.credential));document.querySelectorAll('[data-copy-link]').forEach(b=>b.onclick=async()=>{const x=payload.items.find(i=>i.id===b.dataset.copyLink);await navigator.clipboard.writeText(location.origin+x.shareUrl);const old=b.textContent;b.textContent='已复制';setTimeout(()=>b.textContent=old,1000)})}
function filter(){const q=document.querySelector('#search').value.trim().toLowerCase();document.querySelectorAll('#items .row').forEach(x=>x.hidden=q&&!x.dataset.search.includes(q))}
function availableMembers(page){return [...payload.items.map(x=>({kind:'items',...x})),...payload.sections.filter(x=>x.boardable).map(x=>({kind:'sections',...x}))].filter(x=>!(x.kind==='sections'&&x.page===page))}
function fillFirstMembers(){const page=document.querySelector('#board-page').value;document.querySelector('#board-first-member').innerHTML=availableMembers(page).map(x=>'<option value="'+x.kind+':'+x.id+'">'+esc(x.title)+'（当前：'+esc(x.board?.title||'未分组')+'）</option>').join('')}
function openBoard(){document.querySelector('#board-title').value='';document.querySelector('#board-page').value='home';fillFirstMembers();document.querySelector('#board-dialog').showModal();document.querySelector('#board-title').focus()}
async function saveBoard(){const title=document.querySelector('#board-title').value.trim();const page=document.querySelector('#board-page').value;const [kind,id]=document.querySelector('#board-first-member').value.split(':');if(!title){alert('请填写板块名称');return}await request('../api/boards',{method:'POST',headers:adminHeaders,body:JSON.stringify({title,page,member:{kind,id}})}).then(()=>{document.querySelector('#board-dialog').close();toast('新板块已创建')}).catch(()=>{})}
function openCredential(id){editing=payload.items.find(x=>x.id===id);if(!editing)return;lastSecret='';document.querySelector('#credential-title').textContent=(editing.credential.scope==='independent'?'更换':'设置')+'「'+editing.title+'」项目密码';document.querySelector('#credential-username').value=editing.credential.username||'guest';document.querySelector('#credential-password').value='';document.querySelector('#credential-confirm').value='';document.querySelector('#credential-result').className='result';document.querySelector('#copy-credential').hidden=true;document.querySelector('#credential-dialog').showModal()}
function randomPassword(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';const bytes=new Uint32Array(18);crypto.getRandomValues(bytes);return Array.from(bytes,n=>chars[n%chars.length]).join('')}
async function saveCredential(){const username=document.querySelector('#credential-username').value.trim(),password=document.querySelector('#credential-password').value,confirm=document.querySelector('#credential-confirm').value;if(password!==confirm){alert('两次输入的密码不一致');return}const b=document.querySelector('#save-credential');b.disabled=true;try{const r=await fetch('../api/credentials/items/'+editing.id,{method:'PUT',headers:adminHeaders,body:JSON.stringify({username,password})});const j=await r.json();if(!r.ok)throw new Error(j.error||'保存失败');payload=j;lastSecret='项目：'+editing.title+'\n账号：'+username+'\n密码：'+password+'\n链接：'+location.origin+editing.shareUrl;document.querySelector('#credential-result').textContent='保存成功。请现在复制给使用者；关闭后无法再查看明文密码。';document.querySelector('#credential-result').className='result show';document.querySelector('#copy-credential').hidden=false;render()}catch(e){alert(e.message)}finally{b.disabled=false}}
async function load(){const r=await fetch('../api/state',{cache:'no-store'});if(!r.ok)throw new Error('读取状态失败');payload=await r.json();render()}
document.querySelector('#search').oninput=filter;document.querySelector('#create-board').onclick=openBoard;document.querySelector('#board-page').onchange=fillFirstMembers;document.querySelector('#save-board').onclick=saveBoard;document.querySelector('#close-board').onclick=()=>document.querySelector('#board-dialog').close();document.querySelector('#generate-password').onclick=()=>{const p=randomPassword();document.querySelector('#credential-password').value=p;document.querySelector('#credential-confirm').value=p};document.querySelector('#show-password').onchange=e=>document.querySelectorAll('#credential-password,#credential-confirm').forEach(x=>x.type=e.target.checked?'text':'password');document.querySelector('#save-credential').onclick=saveCredential;document.querySelector('#copy-credential').onclick=async()=>{await navigator.clipboard.writeText(lastSecret);document.querySelector('#copy-credential').textContent='已复制'};document.querySelector('#close-credential').onclick=()=>document.querySelector('#credential-dialog').close();load().catch(e=>document.querySelector('main').innerHTML='<div class="empty">'+esc(e.message)+'</div>');
</script>
</body>
</html>
